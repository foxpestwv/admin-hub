<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Set App Version</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body style="font-family:Arial;background:#0d1117;color:#e2e8f0;padding:40px;max-width:500px;margin:0 auto;">
<h2 style="color:#f59e0b;">Set App Version in Firebase</h2>
<p style="color:#94a3b8;font-size:13px;">Run this whenever you push an update to notify all users.</p>
<div style="margin-bottom:12px;">
  <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px;">Version</label>
  <input id="ver" value="1.0.1" style="width:100%;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;font-size:14px;box-sizing:border-box;">
</div>
<div style="margin-bottom:16px;">
  <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px;">Update note (optional)</label>
  <input id="note" placeholder="e.g. Bug fixes and improvements" style="width:100%;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;font-size:14px;box-sizing:border-box;">
</div>
<button onclick="setVersion()" style="background:#f59e0b;color:#000;border:none;padding:10px 20px;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px;">Set Version</button>
<div id="result" style="margin-top:12px;font-size:13px;"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAq_cRLmI0GZDxPqBPGiX2cTRGhesvvb0w",
  authDomain: "fox-pest-admin-hub.firebaseapp.com",
  projectId: "fox-pest-admin-hub",
  storageBucket: "fox-pest-admin-hub.firebasestorage.app",
  messagingSenderId: "834588931897",
  appId: "1:834588931897:web:816b2f1456f8607d121ae8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

async function setVersion(){
  var ver = document.getElementById("ver").value.trim();
  var note = document.getElementById("note").value.trim();
  if(!ver){ alert("Enter a version"); return; }
  document.getElementById("result").innerHTML = "<span style='color:#94a3b8;'>Signing in...</span>";
  try {
    await auth.signInAnonymously();
    await db.collection("config").doc("appVersion").set({
      version: ver, note: note, updatedAt: new Date().toISOString()
    });
    document.getElementById("result").innerHTML = "<span style='color:#22c55e;'>✓ Version set to "+ver+"</span>";
  } catch(e){
    document.getElementById("result").innerHTML = "<span style='color:#ef4444;'>Error: "+e.message+"</span>";
  }
}
</script>
</body>
</html>
