<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Set App Version</title></head>
<body style="font-family:Arial;background:#0d1117;color:#e2e8f0;padding:40px;max-width:500px;margin:0 auto;">
<h2 style="color:#f59e0b;">Set App Version in Firebase</h2>
<p style="color:#94a3b8;font-size:13px;">Run this whenever you push an update to notify all users.</p>
<div style="margin-bottom:12px;">
  <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px;">Version</label>
  <input id="ver" value="1.0.1" style="width:100%;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;font-size:14px;box-sizing:border-box;">
</div>
<div style="margin-bottom:16px;">
  <label style="font-size:12px;color:#64748b;display:block;margin-bottom:4px;">Update note (optional)</label>
  <input id="note" placeholder="e.g. Bug fixes and improvements" style="width:100%;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:6px;color:#e2e8f0;font-size:14px;box-sizing:border-box;">
</div>
<button onclick="setVersion()" style="background:#f59e0b;color:#000;border:none;padding:10px 20px;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px;">Set Version</button>
<div id="result" style="margin-top:12px;font-size:13px;"></div>

  token_uri: "https://oauth2.googleapis.com/token"

const PROJECT_ID = "fox-pest-admin-hub";
const FIRESTORE_URL = "https://firestore.googleapis.com/v1/projects/"+PROJECT_ID+"/databases/(default)/documents";

async function getToken(){
  const header = btoa(JSON.stringify({alg:"RS256",typ:"JWT"})).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const now = Math.floor(Date.now()/1000);
  const claim = btoa(JSON.stringify({
    iss: SERVICE_ACCOUNT.client_email,
    scope: "https://www.googleapis.com/auth/datastore",
    aud: SERVICE_ACCOUNT.token_uri,
    exp: now+3600, iat: now
  })).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const sigInput = header+"."+claim;
  const pem = SERVICE_ACCOUNT.private_key.replace("-----BEGIN PRIVATE KEY-----","").replace("-----END PRIVATE KEY-----","").replace(/\n/g,"");
  const der = Uint8Array.from(atob(pem), c=>c.charCodeAt(0));
  const key = await crypto.subtle.importKey("pkcs8", der.buffer, {name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("RSASSA-PKCS1-v1_5", key, new TextEncoder().encode(sigInput));
  const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
  const jwt = sigInput+"."+sigB64;
  const resp = await fetch(SERVICE_ACCOUNT.token_uri, {
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:"grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion="+jwt
  });
  const data = await resp.json();
  if(!data.access_token) throw new Error("Auth failed: "+JSON.stringify(data));
  return data.access_token;
}

async function setVersion(){
  var ver = document.getElementById("ver").value.trim();
  var note = document.getElementById("note").value.trim();
  if(!ver){ alert("Enter a version"); return; }
  document.getElementById("result").innerHTML = "<span style='color:#94a3b8;'>Setting version...</span>";
  try {
    const token = await getToken();
    const url = FIRESTORE_URL+"/config/appVersion";
    const fields = {
      version: {stringValue: ver},
      note: {stringValue: note},
      updatedAt: {stringValue: new Date().toISOString()}
    };
    const resp = await fetch(url, {
      method:"PATCH",
      headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body: JSON.stringify({fields})
    });
    if(!resp.ok) throw new Error("Write failed: "+(await resp.text()).substring(0,200));
    document.getElementById("result").innerHTML = "<span style='color:#22c55e;'>✓ Version set to "+ver+"</span>";
  } catch(e){
    document.getElementById("result").innerHTML = "<span style='color:#ef4444;'>Error: "+e.message+"</span>";
  }
}
</script>
