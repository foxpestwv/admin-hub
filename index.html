function _signerColor(i){
  var colors = ["#f59e0b","#3b82f6","#22c55e","#a855f7","#ef4444","#f97316","#06b6d4","#ec4899"];
  return colors[i % colors.length];
}

async function _pdfLoadAndRender(){
  try {
    if(typeof pdfjsLib === "undefined"){
      alert("PDF viewer not loaded yet. Please wait a moment and try again.");
      return;
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    _pdfDoc = await pdfjsLib.getDocument({data: _pdfBytes.slice(0)}).promise;
    _pdfFields = [];
    renderSignUpload(document.getElementById("pg-sign"));
    _pdfRendering = false;
    setTimeout(_pdfRenderPages, 80);
  } catch(e){ alert("Error loading PDF: "+e.message); }
}

var _pdfRendering = false;
async function _pdfRenderPages(){
  if(_pdfRendering) return;
  _pdfRendering = true;
  var wrap = document.getElementById("pdf-pages-wrap");
  if(!wrap || !_pdfDoc){ _pdfRendering=false; return; }
  wrap.innerHTML = "";
  _pdfPageScales = {};

  for(var p = 1; p <= _pdfDoc.numPages; p++){
    var page = await _pdfDoc.getPage(p);
    var viewport = page.getViewport({scale: 1.5});
    var pageDiv = document.createElement("div");
    pageDiv.style.cssText = "position:relative;margin-bottom:8px;border:1px solid #1e3a5f;border-radius:6px;overflow:hidden;";
    pageDiv.dataset.page = p;

    var canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.cssText = "display:block;width:100%;height:auto;";
    pageDiv.appendChild(canvas);
    wrap.appendChild(pageDiv);

    await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
    _pdfPageScales[p] = {w: viewport.width, h: viewport.height};

    // Click listener on the div (not canvas)
    pageDiv.addEventListener("click", (function(pageNum, div){
      return function(ev){
        if(!_pdfArmed) return;
        if(ev.target.closest&&ev.target.closest(".pdf-field-overlay")) return;
        var rect = div.getBoundingClientRect();
        var xPct = (ev.clientX - rect.left) / rect.width;
        var yPct = (ev.clientY - rect.top) / rect.height;
        var wPct = _pdfArmed.type==="date"?0.10:_pdfArmed.type==="name"?0.15:0.18;
        var hPct = _pdfArmed.type==="date"?0.035:0.045;
        _pdfFields.push({signerIdx:_pdfArmed.signerIdx, page:pageNum, xPct:xPct, yPct:yPct, wPct:wPct, hPct:hPct, type:_pdfArmed.type});
        _pdfRenderFieldOverlays();
        // Show count update
        var countEl = document.querySelector("#pdf-pages-wrap").previousElementSibling;
        if(countEl&&countEl.style&&countEl.tagName==="DIV") countEl.textContent = _pdfFields.length+" field(s) placed";
      };
    })(p, pageDiv));
  }
  _pdfRenderFieldOverlays();
  _pdfRendering = false;
}

function _pdfRenderFieldOverlays(){
  document.querySelectorAll(".pdf-field-overlay").forEach(function(el){ el.remove(); });
  _pdfFields.forEach(function(f, idx){
    var pageDiv = document.querySelector("#pdf-pages-wrap [data-page='"+f.page+"']");
    if(!pageDiv) return;
    var color = _signerColor(f.signerIdx);
    var signer = _pdfSigners[f.signerIdx];
    var label = (signer?signer.name.split(" ")[0]:"?")+": "+f.type;

    var box = document.createElement("div");
    box.className = "pdf-field-overlay";
    box.style.cssText = "position:absolute;left:"+(f.xPct*100)+"%;top:"+(f.yPct*100)+"%;width:"+(f.wPct*100)+"%;height:"+(f.hPct*100)+"%;"
      +"border:2px dashed "+color+";background:"+color+"22;color:"+color+";"
      +"font-size:10px;display:flex;align-items:center;justify-content:center;"
      +"border-radius:3px;pointer-events:all;cursor:default;user-select:none;";

    // Label
    var labelSpan = document.createElement("span");
    labelSpan.textContent = label;
    labelSpan.style.cssText = "pointer-events:none;font-size:10px;";
    box.appendChild(labelSpan);

    // Remove button
    var removeBtn = document.createElement("span");
    removeBtn.style.cssText = "position:absolute;top:-7px;left:-7px;background:#ef4444;color:#fff;"
      +"border-radius:50%;width:14px;height:14px;font-size:9px;line-height:14px;text-align:center;cursor:pointer;z-index:2;";
    removeBtn.textContent = "✕";
    removeBtn.onclick = function(ev){
      ev.stopPropagation();
      _pdfFields.splice(idx, 1);
      _pdfRenderFieldOverlays();
    };
    box.appendChild(removeBtn);

    // Resize handle (bottom-right corner)
    var resizeHandle = document.createElement("span");
    resizeHandle.style.cssText = "position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;"
      +"background:"+color+";border-radius:2px 0 3px 0;cursor:se-resize;z-index:2;"
      +"display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;";
    resizeHandle.textContent = "⤡";
    resizeHandle.onmousedown = (function(fi, fbox, fPageDiv){
      return function(ev){
        ev.stopPropagation(); ev.preventDefault();
        var startX=ev.clientX, startY=ev.clientY;
        var startW=fbox.offsetWidth, startH=fbox.offsetHeight;
        var parentW=fPageDiv.offsetWidth, parentH=fPageDiv.offsetHeight;
        function onMove(e){
          var newW = Math.max(40, startW+(e.clientX-startX));
          var newH = Math.max(20, startH+(e.clientY-startY));
          _pdfFields[fi].wPct = newW/parentW;
          _pdfFields[fi].hPct = newH/parentH;
          fbox.style.width = (_pdfFields[fi].wPct*100)+"%";
          fbox.style.height = (_pdfFields[fi].hPct*100)+"%";
        }
        function onUp(){ document.removeEventListener("mousemove",onMove); document.removeEventListener("mouseup",onUp); }
        document.addEventListener("mousemove",onMove);
        document.addEventListener("mouseup",onUp);
      };
    })(idx, box, pageDiv);

    // Touch resize
    resizeHandle.ontouchstart = (function(fi, fbox, fPageDiv){
      return function(ev){
        ev.stopPropagation(); ev.preventDefault();
        var startX=ev.touches[0].clientX, startY=ev.touches[0].clientY;
        var startW=fbox.offsetWidth, startH=fbox.offsetHeight;
        var parentW=fPageDiv.offsetWidth, parentH=fPageDiv.offsetHeight;
        function onMove(e){ e.preventDefault();
          var newW=Math.max(40,startW+(e.touches[0].clientX-startX));
          var newH=Math.max(20,startH+(e.touches[0].clientY-startY));
          _pdfFields[fi].wPct=newW/parentW; _pdfFields[fi].hPct=newH/parentH;
          fbox.style.width=(_pdfFields[fi].wPct*100)+"%"; fbox.style.height=(_pdfFields[fi].hPct*100)+"%";
        }
        function onEnd(){ document.removeEventListener("touchmove",onMove); document.removeEventListener("touchend",onEnd); }
        document.addEventListener("touchmove",onMove,{passive:false});
        document.addEventListener("touchend",onEnd);
      };
    })(idx, box, pageDiv);

    box.appendChild(resizeHandle);
    pageDiv.appendChild(box);
  });
}

async function pdfSendDocument(){
  var docName = S._pdfDocName||(document.getElementById("pdf-doc-name")||{}).value||"";
  var note = S._pdfNote||(document.getElementById("pdf-note")||{}).value||"";
  if(!docName){ alert("Please enter a document name."); return; }
  if(!_pdfBytes){ alert("Please upload a PDF."); return; }
  if(_pdfSigners.length===0){ alert("Please add at least one signer."); return; }
  if(_pdfFields.length===0){ alert("Please place at least one signature field on the document."); return; }

  var btn = document.querySelector("[data-a='pdf-send-doc']");
  if(btn){ btn.disabled=true; btn.textContent="Uploading..."; }

  // Convert to base64
  var bytes = new Uint8Array(_pdfBytes);
  var binary = ""; var chunk = 0x8000;
  for(var i=0;i<bytes.length;i+=chunk) binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  var pdfBase64 = btoa(binary);

  var signerPayload = _pdfSigners.map(function(s,i){
    return {
      name: s.name, email: s.email, id: s.id,
      fields: _pdfFields.filter(function(f){ return f.signerIdx===i; }).map(function(f){
        return {page:f.page, xPct:f.xPct, yPct:f.yPct, wPct:f.wPct, hPct:f.hPct, type:f.type};
      })
    };
  });

  try {
    var result = await gs("uploadMultiSignRequestServer", {
      id: "SIG-"+Date.now(),
      date: new Date().toISOString(),
      docName: docName, note: note,
      createdBy: S.managerName,
      pdfBase64: pdfBase64,
      signers: signerPayload
    });

    if(result && result.ok){
      signerPayload.forEach(function(s, i){
        S.signRequests.unshift({
          id: result.id+"-"+(i+1),
          date: new Date().toISOString(),
          techName: s.name, techEmail: s.email,
          docName: docName, status: "Pending",
          createdBy: S.managerName, note: note,
          fileId: result.fileId,
          isMultiSign: true, multiSignId: result.id
        });
      });
      lsSet("hub:signRequests", S.signRequests);
      _pdfDoc=null; _pdfBytes=null; _pdfFields=[]; _pdfSigners=[]; _pdfArmed=null;
      S._pdfDocName=""; S._pdfNote="";
      S._signView="list"; save();
      alert("Document sent! Signers have been notified.");
      renderSign(true);
    } else {
      alert("Error: "+(result?result.error:"upload failed"));
      if(btn){ btn.disabled=false; btn.textContent="&#x2709; Send for Signatures"; }
    }
  } catch(e){
    alert("Error: "+e.message);
    if(btn){ btn.disabled=false; btn.textContent="&#x2709; Send for Signatures"; }
  }
}

      +"</div>":"")
    // Check if saved signature exists
    +(S._savedManagerSig&&isManager
      ? "<div style='margin-bottom:12px;'>"
        +"<div style='font-size:12px;color:#64748b;margin-bottom:6px;'>Saved signature:</div>"
        +"<img src='"+S._savedManagerSig+"' style='background:white;border-radius:8px;max-width:100%;height:80px;object-fit:contain;border:1px solid #1e3a5f;'>"
        +"<div style='display:flex;gap:8px;margin-top:8px;'>"
        +"<button class='btn bp' style='flex:2;padding:10px;' data-a='sign-use-saved'>Use Saved Signature</button>"
        +"<button class='btn bg' style='flex:1;padding:10px;font-size:12px;' data-a='sign-clear-saved'>Draw New</button>"
        +"</div></div>"
      : "<div style='margin-bottom:6px;font-size:12px;color:#64748b;'>Draw your signature below:</div>"
        +"<canvas id='sig-canvas' style='width:100%;height:200px;background:white;border-radius:10px;border:2px solid #1e3a5f;touch-action:none;display:block;cursor:crosshair;'></canvas>"
        +"<div style='display:flex;gap:8px;margin-top:8px;'>"
        +"<button class='btn bg' style='flex:1;padding:8px;font-size:13px;' data-a='sign-clear-canvas'>Clear</button>"
        +"</div>")
    +"<button class='btn bs' style='width:100%;padding:14px;font-size:15px;margin-top:16px;' data-a='"+(isManager?"sign-submit-manager":"sign-submit-tech")+"'>"
    +(isManager?"Send to Tech for Signature &#x2192;":"Submit Signed Document &#x2713;")+"</button>";

  // Initialize canvas
  setTimeout(function(){
    var canvas = document.getElementById("sig-canvas");
    if(!canvas) return;
    var ctx = canvas.getContext("2d");
    canvas.width = canvas.offsetWidth;
    canvas.height = 200;
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    var drawing = false;
    var lastX=0, lastY=0;
    function getPos(e){
      var rect=canvas.getBoundingClientRect();
      var scaleX=canvas.width/rect.width;
      var scaleY=canvas.height/rect.height;
      if(e.touches){ return {x:(e.touches[0].clientX-rect.left)*scaleX,y:(e.touches[0].clientY-rect.top)*scaleY}; }
      return {x:(e.clientX-rect.left)*scaleX,y:(e.clientY-rect.top)*scaleY};
    }
    function start(e){ e.preventDefault(); drawing=true; var p=getPos(e); lastX=p.x; lastY=p.y; }
    function draw(e){ e.preventDefault(); if(!drawing) return; var p=getPos(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
    function stop(){ drawing=false; }
    canvas.addEventListener("mousedown",start);
    canvas.addEventListener("mousemove",draw);
    canvas.addEventListener("mouseup",stop);
    canvas.addEventListener("touchstart",start,{passive:false});
    canvas.addEventListener("touchmove",draw,{passive:false});
    canvas.addEventListener("touchend",stop);
  },100);
}

function _msRenderFieldBoxes(){
  document.querySelectorAll(".ms-field-box").forEach(function(el){ el.remove(); });
  if(!_msFields||_msFields.length===0){ console.warn("_msRenderFieldBoxes: no fields"); return; }
  _msFields.forEach(function(f, idx){
    var pageDiv = document.querySelector("#ms-pdf-wrap [data-page='"+String(f.page)+"']");
    if(!pageDiv){ console.warn("No pageDiv for page",f.page); return; }
    var box = document.createElement("div");
    box.className = "ms-field-box";
    box.style.cssText = "position:absolute;left:"+(f.xPct*100)+"%;top:"+(f.yPct*100)+"%;width:"+(f.wPct*100)+"%;height:"+(f.hPct*100)+"%;"
      +"border:2px solid;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;";

    if(_msFilled[idx]){
      box.style.borderColor = "#22c55e";
      box.style.background = "rgba(34,197,94,0.1)";
      var img = document.createElement("img");
      img.src = _msFilled[idx];
      img.style.cssText = "max-width:100%;max-height:100%;object-fit:contain;";
      box.appendChild(img);
    } else {
      box.style.borderColor = "#f59e0b";
      box.style.background = "rgba(245,158,11,0.15)";
      box.style.color = "#f59e0b";
      box.style.fontSize = "11px";
      box.style.fontWeight = "600";
      box.textContent = f.type==="date"?"Tap: Date":f.type==="name"?"Tap: Name":"Tap: Sign";
      box.onclick = (function(fi, ftype){ return function(){ _msOpenPad(fi, ftype); }; })(idx, f.type);
    }
    pageDiv.appendChild(box);
  });

  // Check if all filled
  var allDone = _msFields.length>0 && _msFields.every(function(f,idx){ return !!_msFilled[idx]; });
  var btn = document.getElementById("ms-submit-btn");
  if(btn) btn.disabled = !allDone;
}

function _msOpenPad(fieldIdx, fieldType){

    document.getElementById("ms-name-done").onclick = function(){

      tmpCtx.fillStyle = "#111";
      tmpCtx.font = "bold 28px Arial, sans-serif";
      tmpCtx.textAlign = "center";
      tmpCtx.textBaseline = "middle";
      tmpCtx.fillText(name, 200, 40);
      var dataUrl = tmpCanvas.toDataURL("image/png");
      _msFilled[fieldIdx] = dataUrl;
      overlay.remove();
      _msRenderFieldBoxes();

  }

  // For 'date' type: show text input
  if(fieldType==="date"){
    var today = new Date().toLocaleDateString("en-US");
    overlay.innerHTML = "<div style='background:#0f1f38;padding:20px;border-radius:16px;width:90%;max-width:440px;border:1px solid #1e3a5f;'>"
      +"<h3 style='margin:0 0 12px;font-size:15px;color:#e2e8f0;'>Enter today's date</h3>"
      +"<input type='text' id='ms-date-input' class='inp' style='font-size:22px;text-align:center;padding:12px;margin-bottom:12px;' value='"+today+"'>"
      +"<div style='display:flex;gap:8px;'>"
      +"<button class='btn bg' style='flex:1;' id='ms-cancel'>Cancel</button>"
      +"<button class='btn bp' style='flex:2;' id='ms-date-done'>Done</button>"
      +"</div></div>";
    document.body.appendChild(overlay);

    document.getElementById("ms-cancel").onclick = function(){ overlay.remove(); };
    document.getElementById("ms-date-done").onclick = function(){
      var dateVal = (document.getElementById("ms-date-input")||{}).value||today;
      var tmpCanvas2 = document.createElement("canvas");
      tmpCanvas2.width = 300; tmpCanvas2.height = 60;
      var tmpCtx2 = tmpCanvas2.getContext("2d");
      tmpCtx2.fillStyle = "white";
      tmpCtx2.fillRect(0,0,300,60);
      tmpCtx2.fillStyle = "#111";
      tmpCtx2.font = "22px Arial, sans-serif";
      tmpCtx2.textAlign = "center";
      tmpCtx2.textBaseline = "middle";
      tmpCtx2.fillText(dateVal, 150, 30);
      _msFilled[fieldIdx] = tmpCanvas2.toDataURL("image/png");
      overlay.remove();
      _msRenderFieldBoxes();
    };
    return;
  }

  // For 'signature' type: draw on canvas
  overlay.innerHTML = "<div style='background:#0f1f38;padding:20px;border-radius:16px;width:90%;max-width:440px;border:1px solid #1e3a5f;'>"
    +"<h3 style='margin:0 0 10px;font-size:15px;color:#e2e8f0;'>Draw your signature</h3>"
    +(savedSig
      ? "<div style='margin-bottom:10px;'>"
        +"<img src='"+savedSig+"' style='background:white;border-radius:6px;width:100%;height:55px;object-fit:contain;display:block;margin-bottom:6px;'>"
        +"<div style='display:flex;gap:8px;'>"
        +"<button class='btn bp' style='flex:2;padding:8px;font-size:12px;' id='ms-use-saved'>Use Saved Signature</button>"
        +"<button class='btn bg' style='flex:1;padding:8px;font-size:12px;' id='ms-draw-new'>Draw New</button>"
        +"</div></div>"
      : "")
    +"<canvas id='ms-pad' style='width:100%;height:170px;background:white;border-radius:8px;touch-action:none;display:block;margin-bottom:10px;'></canvas>"
    +"<div style='display:flex;gap:8px;'>"
    +"<button class='btn bg' style='flex:1;' id='ms-clear'>Clear</button>"
    +"<button class='btn bg' style='flex:1;' id='ms-cancel'>Cancel</button>"
    +"<button class='btn bp' style='flex:2;' id='ms-done'>Done</button>"
    +"</div></div>";

  document.body.appendChild(overlay);

  var canvas = document.getElementById("ms-pad");
  canvas.width = canvas.offsetWidth||420;
  canvas.height = 170;
  var ctx3 = canvas.getContext("2d");
  ctx3.strokeStyle="#111"; ctx3.lineWidth=2; ctx3.lineCap="round";
  var drawing3=false, lx3=0, ly3=0;

  function gp(e){
    var r=canvas.getBoundingClientRect(), sx=canvas.width/r.width, sy=canvas.height/r.height;
    var src=e.touches?e.touches[0]:e;
    return {x:(src.clientX-r.left)*sx, y:(src.clientY-r.top)*sy};
  }
  canvas.addEventListener("mousedown",function(e){drawing3=true;var p=gp(e);lx3=p.x;ly3=p.y;});
  canvas.addEventListener("mousemove",function(e){if(!drawing3)return;var p=gp(e);ctx3.beginPath();ctx3.moveTo(lx3,ly3);ctx3.lineTo(p.x,p.y);ctx3.stroke();lx3=p.x;ly3=p.y;});
  canvas.addEventListener("mouseup",function(){drawing3=false;});
  canvas.addEventListener("touchstart",function(e){e.preventDefault();drawing3=true;var p=gp(e);lx3=p.x;ly3=p.y;},{passive:false});
  canvas.addEventListener("touchmove",function(e){e.preventDefault();if(!drawing3)return;var p=gp(e);ctx3.beginPath();ctx3.moveTo(lx3,ly3);ctx3.lineTo(p.x,p.y);ctx3.stroke();lx3=p.x;ly3=p.y;},{passive:false});
  canvas.addEventListener("touchend",function(){drawing3=false;});

  function savePad(dataUrl){
    if(S.role==="manager") S._savedManagerSig=dataUrl; else S._savedTechSig=dataUrl;
    _msFilled[fieldIdx] = dataUrl;
    overlay.remove();
    _msRenderFieldBoxes();
  }

  document.getElementById("ms-clear").onclick = function(){ ctx3.clearRect(0,0,canvas.width,canvas.height); };
  document.getElementById("ms-cancel").onclick = function(){ overlay.remove(); };
  document.getElementById("ms-done").onclick = function(){ savePad(canvas.toDataURL("image/png")); };

  var useSaved = document.getElementById("ms-use-saved");
  if(useSaved) useSaved.onclick = function(){ savePad(savedSig); };
  var drawNew = document.getElementById("ms-draw-new");
  if(drawNew) drawNew.onclick = function(){ ctx3.clearRect(0,0,canvas.width,canvas.height); };
}

async function submitMultiSign(){
  var req = S._pendingSignReq;
  if(!req||!_msPdfBytes){ alert("Document not loaded."); return; }

  var btn = document.getElementById("ms-submit-btn");
  if(btn){ btn.disabled=true; btn.textContent="Embedding signatures..."; }

  try {
    // Embed signatures into PDF with pdf-lib
    var pdfLibDoc = await PDFLib.PDFDocument.load(_msPdfBytes.slice(0));
    var pages3 = pdfLibDoc.getPages();

    for(var idx3=0; idx3<_msFields.length; idx3++){
      var f3 = _msFields[idx3];
      var fillUrl = _msFilled[idx3];
      if(!fillUrl) continue;

      var b64img = fillUrl.split(",")[1];
      var imgBin = atob(b64img);
      var imgBytes2 = new Uint8Array(imgBin.length);
      for(var bi=0;bi<imgBin.length;bi++) imgBytes2[bi]=imgBin.charCodeAt(bi);

      var pngEmbed = await pdfLibDoc.embedPng(imgBytes2.buffer);
      var pg4 = pages3[f3.page-1];
      var pw3=pg4.getWidth(), ph3=pg4.getHeight();
      pg4.drawImage(pngEmbed,{
        x: f3.xPct * pw3,
        y: ph3 - (f3.yPct * ph3) - (f3.hPct * ph3),
        width: f3.wPct * pw3,
        height: f3.hPct * ph3
      });
    }

    if(btn) btn.textContent="Uploading...";
    var outBytes3 = await pdfLibDoc.save();
    var bin3=""; var ch3=0x8000;
    var ub3=new Uint8Array(outBytes3);
    for(var i3=0;i3<ub3.length;i3+=ch3) bin3+=String.fromCharCode.apply(null,ub3.subarray(i3,i3+ch3));
    var outB64 = btoa(bin3);

    var techSigUrl = _msFilled[_msFields.findIndex(function(f){ return f.type==="signature"; })];

    var result = await gs("submitMultiSignServer", {
      id: req.id,
      multiSignId: req.multiSignId||"",
      techName: req.techName,
      techSig: techSigUrl||null,
      signedPdfBase64: outB64,
      signedDate: new Date().toISOString(),
      managerEmail: "john.kluttz@fox-marketingservices.com"
    });

    if(result&&result.ok){
      var idx4 = S.signRequests.findIndex(function(r){ return r.id===req.id; });
      if(idx4>=0){ S.signRequests[idx4].status="Signed"; S.signRequests[idx4].signedFileId=result.signedFileId||""; }
      S._pendingSignReq=null; S._signView="list";
      _msFilled={}; _msFields=[]; _msPdfBytes=null; _msPdfDoc=null;
      lsSet("hub:signRequests",S.signRequests); save();
      alert("Signed successfully! The manager has been notified.");
      renderSign(true); render();
    } else {
      alert("Error: "+(result?result.error:"unknown"));
      if(btn){ btn.disabled=false; btn.textContent="Submit Signature ✓"; }
    }
  } catch(e){
    alert("Error: "+e.message);
    if(btn){ btn.disabled=false; btn.textContent="Submit Signature ✓"; }
  }
}

async function signLoadFile(){
  var sel = document.getElementById("sign-tech-sel");
  var fileInp = document.getElementById("sign-file-inp");
  var note = (document.getElementById("sign-note")||{}).value||"";
  if(!sel||!sel.value){ alert("Please select a technician."); return; }
  if(!fileInp||!fileInp.files||!fileInp.files[0]){ alert("Please select a PDF file."); return; }

  var file = fileInp.files[0];
  var tech = S.techAccounts.find(function(t){ return t.id===sel.value; });
  if(!tech){ alert("Tech not found."); return; }

  // Read file as base64
  var reader = new FileReader();
  reader.onload = function(e){
    var b64 = e.target.result.split(",")[1];
    var req = {
      id: "SIG-"+Date.now(),
      date: new Date().toISOString(),
      techName: tech.name,
      techEmail: tech.email||"",
      techId: tech.id,
      docName: file.name,
      status: "Pending",
      createdBy: S.managerName,
      note: note,
      fileData: b64,
      managerSig: null,
      techSig: null
    };
    S._pendingSignReq = req;
    S._signView = "signing";
    renderSign();
  };
  reader.readAsDataURL(file);
}

async function signSubmitManager(){
  var req = S._pendingSignReq;
  if(!req){ alert("No document loaded."); return; }

  // Get signature
  var sigData = null;
  if(S._savedManagerSig && !document.getElementById("sig-canvas")){
    sigData = S._savedManagerSig;
  } else {
    var canvas = document.getElementById("sig-canvas");
    if(!canvas){ alert("Signature canvas not found."); return; }
    sigData = canvas.toDataURL("image/png");
    // Save for future use
    S._savedManagerSig = sigData;
  }

  req.managerSig = sigData;
  req.date = new Date().toISOString();

  // Show loading
  var btn = document.querySelector("[data-a='sign-submit-manager']");
  if(btn){ btn.disabled=true; btn.textContent="Uploading..."; }

  try {
    // Upload original PDF to Drive and log to sheet
    var result = await gs("uploadSignRequestServer", {
      id: req.id,
      date: req.date,
      techName: req.techName,
      techEmail: req.techEmail,
      docName: req.docName,
      createdBy: req.createdBy,
      note: req.note,
      status: "Pending",
      fileData: req.fileData||null,
      existingFileId: req.fileId||null,
      managerSig: req.managerSig,
      isQA: req.isQA||false,
      isRA: req.isRA||false,
      qaData: req.qaData||null,
      raData: req.raData||null
    });

    if(result && result.ok){
      req.fileId = result.fileId;
      req.signedFileId = null;
      // Add to local state
      S.signRequests.unshift(req);
      S._pendingSignReq = null;
      S._signView = "list";
      delete req.fileData; // don't keep large data in memory
      save();
      alert("Document uploaded! "+req.techName+" will be notified by email.");
      renderSign();
    } else {
      alert("Upload failed: "+(result?result.error:"unknown error"));
      if(btn){ btn.disabled=false; btn.textContent="Send to Tech for Signature →"; }
    }
  } catch(e){
    alert("Error: "+e.message);
    if(btn){ btn.disabled=false; btn.textContent="Send to Tech for Signature →"; }
  }
}

  var sigData = null;
  if(S._savedTechSig && !document.getElementById("sig-canvas")){
    sigData = S._savedTechSig;
  } else {
    var canvas = document.getElementById("sig-canvas");
    if(!canvas){ alert("Please draw your signature."); return; }
    sigData = canvas.toDataURL("image/png");
    S._savedTechSig = sigData;
  }

  var btn = document.querySelector("[data-a='sign-submit-tech']");
  if(btn){ btn.disabled=true; btn.textContent="Submitting..."; }

  try {
    // Step 1: Update Firebase status
    var result = await gs("submitTechSignatureServer", {
      id: req.id,
      techName: req.techName,
      techSig: sigData,
      signedDate: new Date().toISOString()
    });

    if(result && result.ok){
      // Step 2: Call Apps Script ONCE to export PDF and email manager
      if((req.isQA||req.isRA) && !req._bridgeCalled){
        req._bridgeCalled = true;
        fetch(EMAIL_BRIDGE, {
          method:"POST", headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({
            action: "submitTechSignature",
            techName: req.techName||"",
            techEmail: req.techEmail||"",
            techSig: sigData,
            managerSig: req.managerSig||"",
            managerEmail: "john.kluttz@fox-marketingservices.com",
            isQA: req.isQA||false,
            isRA: req.isRA||false,
            docName: req.docName||"",
            createdBy: req.createdBy||S.managerName
          })
        }).then(function(r){ return r.json(); }).catch(function(e){ console.warn("Bridge:", e.message); });
      }
      // Update local state immediately
      var idx = S.signRequests.findIndex(function(r){ return r.id===req.id; });
      if(idx>=0){
        S.signRequests[idx].status = "Signed";
        S.signRequests[idx].signedFileId = result.signedFileId||"";
        S.signRequests[idx].signedDate = new Date().toISOString();
      } else {
        // Not in local state - add it
        req.status = "Signed";
        S.signRequests.unshift(req);
      }
      S._pendingSignReq = null;
      S._signView = "list";
      _techSigSubmitting = false;
      save();
      alert("Document signed successfully! The manager has been notified.");
      // Render immediately from local state without reloading from sheet
      renderSign(true);
      render(); // Update badge
    } else {
      alert("Error: "+(result?result.error:"unknown"));
      if(btn){ btn.disabled=false; btn.textContent="Submit Signed Document ✓"; }
    }
  } catch(e){
    alert("Error: "+e.message);
    if(btn){ btn.disabled=false; btn.textContent="Submit Signed Document ✓"; }
  }
}

// ─── Drag and Drop for Inspection Categories and Items ─────────────────────────
(function(){
  var dragType=null, dragIdx=null, dragCatId=null;

  document.addEventListener("dragstart", function(e){
    var el = e.target;
    while(el && !el.dataset.dragtype) el=el.parentElement;
    if(!el) return;
    dragType = el.dataset.dragtype;
    dragIdx = parseInt(el.dataset.dragidx);
    dragCatId = el.dataset.dragcatid||null;
    e.dataTransfer.effectAllowed="move";
    setTimeout(function(){ el.style.opacity="0.4"; }, 0);
  });

  document.addEventListener("dragend", function(e){
    var el = e.target;
    while(el && !el.dataset.dragtype) el=el.parentElement;
    if(el) el.style.opacity="1";
  });

  document.addEventListener("dragover", function(e){
    e.preventDefault();
    e.dataTransfer.dropEffect="move";
  });

  document.addEventListener("drop", function(e){
    e.preventDefault();
    var el = e.target;
    while(el && !el.dataset.dragtype) el=el.parentElement;
    if(!el) return;
    var dropType = el.dataset.dragtype;
    var dropIdx = parseInt(el.dataset.dragidx);
    var dropCatId = el.dataset.dragcatid||null;

    if(dragType==="cat" && dropType==="cat" && dragIdx!==dropIdx){
      // Reorder categories
      var moved = S.cats.splice(dragIdx,1)[0];
      S.cats.splice(dropIdx,0,moved);
      save(); renderSettings();
    } else if(dragType==="item" && dropType==="item" && dragCatId===dropCatId && dragIdx!==dropIdx){
      // Reorder items within same category
      var cat = S.cats.find(function(c){return c.id===dragCatId;});
      if(cat){
        var movedItem = cat.items.splice(dragIdx,1)[0];
        cat.items.splice(dropIdx,0,movedItem);
        save(); renderSettings();
      }
    }
    dragType=null; dragIdx=null; dragCatId=null;
  });
})();

    const reset = confirm(acct.name+" has already set their PIN. Would you like to reset it first so you can send them a new temp PIN?");
    if(!reset) return;
    const newPin = prompt("New temporary PIN for "+acct.name+" (4-8 digits):");
    if(!newPin||newPin.length<4){ alert("PIN must be at least 4 digits."); return; }
    acct.pin=""; acct.tempPin=newPin; acct.isTemp=true;
    if(role==="manager") S.managers[idx]=acct; else S.techAccounts[idx]=acct;
    save(); saveAccountsToSheet();
  }
  const pin = acct.isTemp ? acct.tempPin : tempPin;
  const appUrl = window.location.href.split("?")[0];
  const subject = "Fox Pest Control Admin Hub - Your Login Information";
  const body = "Hello "+acct.name+",\n\n"
    +"You have been set up on the Fox Pest Control Willamette Valley Admin Hub.\n\n"
    +"App URL: "+appUrl+"\n"
    +"Your Email: "+acct.email+"\n"
    +"Temporary PIN: "+pin+"\n\n"
    +"To log in:\n"
    +"1. Open the App URL above\n"
    +"2. Enter your email address\n"
    +"3. Enter your temporary PIN\n"
    +"4. You will be prompted to create your own personal PIN\n\n"
    +"Please keep your PIN private.\n\n"
    +"Fox Pest Control - Willamette Valley Branch";
  try {
    await gs("sendEmailServer", {to: acct.email, subject: subject, body: body});
    alert("Login email sent to "+acct.email+"!");
    render();
  } catch(e){
    alert("Could not send email: "+e.message);
  }
}

// v2.0.0 Welcome splash - called after login
function showWelcomeSplash(){
  var splashKey = "hub:splash_v207";
  var firstSeen = localStorage.getItem(splashKey);
  var now = Date.now();
  var oneWeek = 7 * 24 * 60 * 60 * 1000;
  if(!firstSeen){
    localStorage.setItem(splashKey, String(now));
  } else if(now - parseInt(firstSeen) > oneWeek){
    return; // More than a week has passed, stop showing
  }

  var splash = document.getElementById("welcome-splash");
  if(!splash) return;
  splash.style.display = "flex";

  // Fireworks
  var canvas = document.getElementById("firework-canvas");
  var ctx = canvas.getContext("2d");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  var particles = [];
  var colors = ["#f59e0b","#ef4444","#8b5cf6","#22c55e","#3b82f6","#ec4899","#fff"];

  function spawnFirework(x, y){
    for(var i=0;i<60;i++){
      var angle = (Math.PI*2/60)*i;
      var speed = 2+Math.random()*6;
      particles.push({
        x:x, y:y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        life:1, decay:0.012+Math.random()*0.015,
        size:2+Math.random()*3,
        color:colors[Math.floor(Math.random()*colors.length)]
      });
    }
  }

  // Launch fireworks at intervals
  var fw_times = [200,500,800,1100,1400,1700,2000,2300];
  fw_times.forEach(function(t, i){
    setTimeout(function(){
      var x = canvas.width*(0.2+Math.random()*0.6);
      var y = canvas.height*(0.15+Math.random()*0.5);
      spawnFirework(x, y);
    }, t);
  });

  var animId;
  function drawParticles(){
    ctx.fillStyle = "rgba(7,15,30,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    particles = particles.filter(function(p){ return p.life>0; });
    particles.forEach(function(p){
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*p.life, 0, Math.PI*2);
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08; // gravity
      p.life -= p.decay;
    });
    ctx.globalAlpha = 1;
    if(particles.length > 0 || Date.now() - startTime < 3000){
      animId = requestAnimationFrame(drawParticles);
    }
  }

  var startTime = Date.now();
  drawParticles();

  // Auto-dismiss after 3.5s
  setTimeout(function(){
    splash.classList.add("fade-out");
    setTimeout(function(){
      splash.style.display = "none";
      cancelAnimationFrame(animId);
    }, 800);
  }, 3500);

  // Tap to dismiss early
  splash.addEventListener("click", function(){
    splash.classList.add("fade-out");
    setTimeout(function(){
      splash.style.display = "none";
      cancelAnimationFrame(animId);
    }, 800);
  });
}

// Global click handler
function globalHandler(e){
  var t = e.target;
  while(t && t !== document.body){
    if(t.getAttribute && t.getAttribute("data-a")){
      handleAction(t.getAttribute("data-a"), t.getAttribute("data-v")||"", t, e);
      return;
    }
    t = t.parentElement;
  }
}
