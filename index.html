async function refreshOrders(){
  try {
    var pendResult = await gs("getPendingServer", null);
    var histResult = await gs("getOrderHistoryServer", null);
    var pending = (pendResult && pendResult.orders) ? pendResult.orders : [];
    var history = (histResult && histResult.orders) ? histResult.orders : [];
    S.orders = pending.concat(history.filter(function(h){
      return !pending.some(function(p){ return p.id===h.id; });
    }));
    lsSet("hub:orders", S.orders);
  } catch(e){ console.warn("Refresh orders:", e.message); }
  renderOrders();
}

function getBaseId(orderId){
  if(!orderId) return "unknown";
  var parts = orderId.split("-");
  // Handle ORD-timestamp (2 parts) and ORD-timestamp-sheet_XX (3 parts)
  // Always return just ORD-timestamp
  if(parts.length>=2) return parts[0]+"-"+parts[1];
  return orderId;
}

function renderOrders(){
  const {orders,products}=S;
  console.log("renderOrders: total orders="+orders.length+", first="+JSON.stringify(orders[0]||null));
  const filter=S.ordersFilter;
  const pend=orders.filter(o=>o.status==="Pending").length;
  function osc(st){return st==="Pending"?"#f59e0b":st==="Approved"?"#22c55e":"#ef4444";}
  const fbtns=["Pending","Approved","Denied","All"].map(function(f){
    return "<button class='fb"+(filter===f?" on":"")+"' data-a='order-filter' data-v='"+f+"'>"+f+(f==="Pending"&&pend>0?" ("+pend+")":"")+"</button>";
  }).join("");

  // Group orders by base order ID
  // Handle both formats: grouped (items array) and flat (one doc per item)
  var groups = {};
  orders.forEach(function(o){
    var baseId = getBaseId(o.id);
    if(!groups[baseId]) groups[baseId]={
      id: baseId,
      tech:o.tech||o.techName||"",
      techEmail:o.techEmail||"",
      date:o.date||o.createdAt||"",
      status:o.status||"Pending",
      approvedBy:o.approvedBy||"",
      items:[]
    };

    if(Array.isArray(o.items) && o.items.length>0){
      // Already grouped format from Firebase — use items directly
      o.items.forEach(function(item){
        groups[baseId].items.push({
          id: baseId+"-"+(item.productId||item.name||Math.random()),
          product: item.name||"",
          requestedQty: Number(item.qty)||0,
          approvedQty: Number(item.approvedQty)||0,
          unit: item.unit||"",
          notes: item.notes||"",
          productId: item.productId||"",
          status: o.status||"Pending",
          approvedBy: o.approvedBy||"",
          denyReason: o.denyReason||""
        });
      });
    } else if(!o.items || o.items.length===0){
      // Single flat item format
      groups[baseId].items.push({
        id: o.id,
        product: o.product||o.name||"",
        requestedQty: Number(o.requestedQty||o.qty)||0,
        approvedQty: Number(o.approvedQty)||0,
        unit: o.unit||"",
        notes: o.notes||"",
        productId: o.productId||"",
        status: o.status||"Pending",
        approvedBy: o.approvedBy||"",
        denyReason: o.denyReason||""
      });
    }
    if(o.status==="Pending") groups[baseId].status="Pending";
  });

  var filteredGroups = Object.values(groups).filter(function(g){
    return filter==="All" || g.status===filter;
  });

  var cards = filteredGroups.map(function(group){
    var baseId = getBaseId(group.items[0].id);

        ?"<div style='font-size:11px;color:#22c55e;margin-top:2px;'>Approved: "+o.approvedQty+" "+esc(o.unit)+" by "+esc(o.approvedBy)+"</div>"
        :o.status==="Denied"
        ?"<div style='font-size:11px;color:#ef4444;margin-top:2px;'>Denied by "+esc(o.approvedBy||"")+(o.denyReason?" - "+esc(o.denyReason):"")+"</div>"
        :"";

      if(isActive && o.status==="Pending"){
        // Show per-item controls: qty input + approve/deny toggle
        var itemDecision = S._itemDecisions ? (S._itemDecisions[o.id]||"approve") : "approve";
        return "<div style='background:#0a1628;border-radius:8px;padding:10px 12px;margin-bottom:8px;border:1px solid #1e3a5f;'>"
          +"<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px;'>"
          +"<div style='flex:1;font-size:14px;font-weight:600;'>"+esc(o.product)+"</div>"
          +(o.notes?"":"")
          +"</div>"
          +(o.notes?"<div style='font-size:11px;color:#64748b;font-style:italic;margin-bottom:8px;'>"+esc(o.notes)+"</div>":"")
          +"<div style='display:flex;align-items:center;gap:8px;'>"
          +"<div style='font-size:12px;color:#94a3b8;'>Qty:</div>"
          +"<input type='number' class='inp' id='aqty-"+o.id+"' value='"+((o.requestedQty||o.qty||0)||o.qty||0)+"' style='width:70px;padding:5px;font-size:14px;font-weight:700;text-align:center;'>"
          +"<div style='font-size:12px;color:#64748b;'>"+esc(o.unit)+stockInfo+"</div>"
          +"<div style='margin-left:auto;display:flex;gap:6px;'>"
          +"<button class='btn "+(itemDecision==="approve"?"bs":"bg")+"' style='padding:5px 12px;font-size:12px;' data-a='toggle-item-decision' data-v='"+o.id+"|approve'>Approve</button>"

      +"<div><div style='font-weight:700;font-size:16px;'>"+esc(group.tech)+"</div>"
      +"<div style='color:#64748b;font-size:12px;margin-top:2px;'>"+fd(group.date||"")+" &bull; "+group.items.length+" item"+(group.items.length>1?"s":"")+"</div></div>"

  document.getElementById("pg-orders").innerHTML=
    "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;'>"

    +"</div><div style='display:flex;gap:6px;'>"

    +(filteredGroups.length===0?"<div style='text-align:center;color:#475569;padding:40px;'>No "+filter.toLowerCase()+" orders.</div>":cards);

async function confirmApprove(baseId){
  var submitBtn = document.querySelector("[data-a='approve-order']");
  if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent="Processing..."; submitBtn.style.opacity="0.6"; }

  // Find the grouped order - it may be stored as a single doc with items array
  // or as multiple flat docs
  var groupedOrder = S.orders.find(function(o){ return o.id===baseId || getBaseId(o.id)===baseId; });
  var flatOrders = S.orders.filter(function(o){ return getBaseId(o.id)===baseId && o.status==="Pending"; });

  var tech="", techEmail="", reason="";
  var approvedItems=[], deniedItems=[], low=[], writes=[];

  reason = (document.getElementById("deny-rsn-"+baseId)||{}).value||"";

  if(groupedOrder && Array.isArray(groupedOrder.items) && groupedOrder.items.length>0){
    // Grouped format — process items array
    tech = groupedOrder.tech||groupedOrder.techName||"";
    techEmail = groupedOrder.techEmail||"";

    var updatedItems = groupedOrder.items.map(function(item){
      var itemId = baseId+"-"+(item.productId||item.name);
      var decision = (S._itemDecisions&&S._itemDecisions[itemId])||"approve";
      var qtyInp = document.getElementById("aqty-"+itemId);
      var qty = qtyInp ? (parseInt(qtyInp.value)||item.requestedQty||item.qty||0) : (item.requestedQty||item.qty||0);
      var prod = S.products.find(function(p){ return p.name===item.product||p.name===item.name; });

      if(decision==="approve"){
        if(prod){ var nq=Math.max(0,prod.qty-qty); prod.qty=nq; if(prod.qty<=prod.lowAt) low.push(prod);
          writes.push(gs("updateQtyServer",{id:prod.id,qty:prod.qty,productId:prod.id})); }
        approvedItems.push((item.product||item.name)+" x "+qty+" "+(item.unit||""));
        return Object.assign({},item,{status:"Approved",approvedQty:qty,approvedBy:S.managerName});
      } else {
        deniedItems.push((item.product||item.name)+" x "+(item.qty||0)+" "+(item.unit||""));
        return Object.assign({},item,{status:"Denied",approvedQty:0,approvedBy:S.managerName,denyReason:reason});
      }
    });

    // Determine overall order status
    var allDenied = updatedItems.every(function(i){ return i.status==="Denied"; });
    var anyApproved = updatedItems.some(function(i){ return i.status==="Approved"; });
    var overallStatus = allDenied?"Denied":anyApproved?"Approved":"Denied";

    // Update Firebase
    writes.push(gs("updateOrderStatusServer",{
      id: baseId,
      collection: "pendingOrders",
      status: overallStatus,
      approvedBy: S.managerName,
      items: JSON.stringify(updatedItems)
    }));

    // Move to orderHistory
    writes.push(gs("addOrderHistoryServer",{
      id: baseId,
      date: groupedOrder.date||new Date().toISOString(),
      tech: tech, techEmail: techEmail,
      status: overallStatus,
      approvedBy: S.managerName,
      items: JSON.stringify(updatedItems)
    }));

    // Update local state
    groupedOrder.status = overallStatus;
    groupedOrder.items = updatedItems;
    // Remove from pendingOrders in local state
    S.orders = S.orders.filter(function(o){ return o.id!==baseId; });

  } else {
    // Flat format
    tech = flatOrders.length ? (flatOrders[0].tech||"") : "";
    techEmail = flatOrders.length ? (flatOrders[0].techEmail||"") : "";

    for(var i=0; i<flatOrders.length; i++){
      var order = flatOrders[i];
      var decision2 = (S._itemDecisions&&S._itemDecisions[order.id])||"approve";
      var qtyInp2 = document.getElementById("aqty-"+order.id);
      var qty2 = qtyInp2 ? (parseInt(qtyInp2.value)||order.requestedQty||0) : (order.requestedQty||0);
      var prod2 = S.products.find(function(p){ return p.id===order.productId; });

      if(decision2==="approve"){
        if(prod2){ var nq2=Math.max(0,prod2.qty-qty2); prod2.qty=nq2; if(prod2.qty<=prod2.lowAt) low.push(prod2);
          writes.push(gs("updateQtyServer",{id:prod2.id,qty:prod2.qty})); }
        order.status="Approved"; order.approvedQty=qty2; order.approvedBy=S.managerName;
        approvedItems.push(order.product+" x "+qty2+" "+esc(order.unit));
        writes.push(gs("updateOrderStatusServer",{id:order.id,collection:"pendingOrders",status:"Approved",approvedQty:qty2,approvedBy:S.managerName}));
        writes.push(gs("addOrderHistoryServer",Object.assign({},order,{approvedQty:qty2,approvedBy:S.managerName})));
      } else {
        order.status="Denied"; order.approvedQty=0; order.approvedBy=S.managerName; order.denyReason=reason;
        deniedItems.push(order.product+" x "+(order.requestedQty||0)+" "+esc(order.unit));
        writes.push(gs("updateOrderStatusServer",{id:order.id,collection:"pendingOrders",status:"Denied",approvedQty:0,approvedBy:S.managerName}));
      }
    }
    S.orders = S.orders.filter(function(o){ return getBaseId(o.id)!==baseId||o.status!=="Pending"; });
  }

  S.editOrderId=null; S._itemDecisions={}; lsSet("hub:orders",S.orders); renderOrders();

  try { await Promise.all(writes); } catch(e){ console.warn("Order writes:", e); }

  // One email summarizing both approved and denied
  var te=techEmail; // Only send to tech on approval/denial
  if(!te){ console.warn("No tech email found, skipping approval email"); S.editOrderId=null; S._itemDecisions={}; save(); renderOrders(); if(low.length) sendLowEmail(low); return; }
  var body="Order Decision - Fox Pest Control Willamette Valley\n\n"
    +"Technician: "+tech+"\nDecided By: "+S.managerName+"\n\n";

// ─── Barcode Scanner ─────────────────────────────────────────────────────────
var _scannerActive = false;
var _lastScannedCode = "";
var _scanConfirmCount = 0;
var _scanConfirmNeeded = 3;
var _lastScanTime = 0;
var _scanCooldown = 1500; // ms between accepted scans
var _scannerStream = null;
var _scannerCallback = null;
var _scannerMode = null; // "register" or "pull"
var _scannerProductId = null;
var _codeReader = null;

function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
}

async function startScanner(mode, productId, callback){
  _scannerMode = mode;
  _scannerProductId = productId;
  _scannerCallback = callback;

  var title = mode==="register" ? "Register Barcode" : mode==="lookup" ? "Product Lookup" : "Scan to Pull";
  var hint = mode==="register"
    ? (S.products.find(function(p){return p.id===productId;})||{name:"product"}).name
    : "Scan any product barcode";

  // Show overlay
  // Show scanner as centered floating card
  var overlay = document.getElementById("scanner-overlay");
  var vw = window.innerWidth;
  var w = Math.min(vw - 32, 380);
  var left = (vw - w) / 2;
  var top3 = Math.max(70, (window.innerHeight - 400) / 2);
  overlay.style.cssText = [
    "display:flex",
    "flex-direction:column",
    "position:fixed",
    "left:"+left+"px",
    "top:"+top3+"px",
    "width:"+w+"px",
    "background:#0a1628",
    "border:2px solid #f59e0b",
    "border-radius:16px",
    "z-index:999999",
    "overflow:hidden",
    "box-shadow:0 8px 40px rgba(0,0,0,0.9)"
  ].join(";");
  document.getElementById("scanner-title").textContent = title;
  document.getElementById("scanner-hint").textContent = hint;
  document.getElementById("scanner-result").textContent = "Starting camera...";

  try {
    _scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    var video = document.getElementById("scanner-video");
    video.srcObject = _scannerStream;
    video.muted = true;
    video.playsInline = true;
    await video.play();
    _scannerActive = true;
    _lastScannedCode = "";
    _scanConfirmCount = 0;
    document.getElementById("scanner-result").textContent = "Point at barcode...";
    // Animate scan bar with JS since CSS animations may not work on iOS PWA
    var bar = document.getElementById("scanner-bar");
    if(bar){
      var barDir = 1; var barPos = 0;
      var barAnim = setInterval(function(){
        if(!_scannerActive){ clearInterval(barAnim); return; }
        barPos += barDir * 3;
        if(barPos >= 88) barDir = -1;
        if(barPos <= 0) barDir = 1;
        bar.style.top = barPos + "%";
      }, 20);
    }

    // Use html5-qrcode for best iPhone compatibility
    if(typeof Html5Qrcode !== "undefined"){
      var scannerDiv = document.getElementById("scanner-video").parentElement;
      var h5div = document.createElement("div");
      h5div.id = "h5-scanner-div";
      h5div.style.cssText = "position:absolute;top:0;left:0;width:100%;height:100%;";
      scannerDiv.appendChild(h5div);
      document.getElementById("scanner-video").style.display = "none";

      window._h5scanner = new Html5Qrcode("h5-scanner-div");
      var h5config = {
        fps: 10,
        qrbox: {width:250, height:100},
        aspectRatio: 1.7,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39
        ]
      };
      window._h5scanner.start(
        {facingMode:"environment"},
        h5config,
        function(decodedText){ if(_scannerActive) onBarcodeScanned(decodedText); },
        function(err){ /* ignore scan failures */ }
      ).catch(function(e){
        document.getElementById("scanner-result").textContent = "Camera error: "+e;
      });
    } else if(typeof BarcodeDetector !== "undefined"){
      var detector2 = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"]});
      var detect2 = async function(){
        if(!_scannerActive) return;
        try {
          var codes2 = await detector2.detect(video);
          if(codes2.length>0){ await onBarcodeScanned(codes2[0].rawValue); }
        } catch(e){}
        if(_scannerActive) requestAnimationFrame(detect2);
      };
      requestAnimationFrame(detect2);
    } else if(typeof Quagga !== "undefined"){
      await new Promise(function(r){ setTimeout(r,500); });
      Quagga.init({
        inputStream:{type:"LiveStream",target:video,constraints:{facingMode:"environment"}},
        decoder:{readers:["ean_reader","ean_8_reader","upc_reader","upc_e_reader","code_128_reader"]}
      }, function(err){
        if(!err){ Quagga.start(); document.getElementById("scanner-result").textContent = "Point at barcode..."; }
      });
      Quagga.onDetected(function(r){
        if(r&&r.codeResult&&_scannerActive) onBarcodeScanned(r.codeResult.code);
      });
    }
  } catch(e){
    document.getElementById("scanner-result").textContent = "Camera error: "+e.message;
    document.getElementById("scanner-result").style.color = "#ef4444";
  }
}

function stopScanner(){
  _scannerActive = false;
  // Stop html5-qrcode if running
  try {
    if(window._h5scanner){
      window._h5scanner.stop().then(function(){
        window._h5scanner.clear();
        window._h5scanner = null;
        var h5div = document.getElementById("h5-scanner-div");
        if(h5div) h5div.remove();
        document.getElementById("scanner-video").style.display = "";
      }).catch(function(){});
    }
  } catch(e){}
  try { if(typeof ZXingBrowser!=="undefined" && window._zxingReader) { window._zxingReader.reset(); } } catch(e){}
  if(_codeReader){ try{ _codeReader.reset(); }catch(e){} _codeReader=null; }
  if(typeof Quagga !== "undefined"){ try{ Quagga.stop(); }catch(e){} }
  if(_scannerStream){ _scannerStream.getTracks().forEach(function(t){ t.stop(); }); _scannerStream=null; }
  var video = document.getElementById("scanner-video");
  if(video){ video.srcObject = null; }
  document.getElementById("scanner-overlay").style.display = "none";
  _scannerCallback = null;
  _scannerMode = null;
  _scannerProductId = null;
}

async function onBarcodeScanned(code){
  if(!code||!_scannerActive) return;
  // Only accept codes that look like real barcodes
  var trimmed = code.trim();
  var isNumeric = /^\d{6,14}$/.test(trimmed);
  var isAlphaNum = /^[A-Za-z0-9\-]{6,20}$/.test(trimmed);
  if(!isNumeric && !isAlphaNum){
    // Looks like random text - ignore silently
    return;
  }
  // Cooldown - ignore reads within 1.5s of last accepted scan
  var now = Date.now();
  if(now - _lastScanTime < _scanCooldown) return;

  // Normalize for comparison
  var normCode = trimmed.replace(/^0+/,"") || trimmed;
  var normLast = (_lastScannedCode||"").replace(/^0+/,"") || _lastScannedCode;

  if(normCode === normLast && normCode.length > 0){
    _scanConfirmCount++;
  } else {
    _lastScannedCode = trimmed;
    _scanConfirmCount = 1;
  }
  document.getElementById("scanner-result").textContent = "Hold steady... ("+_scanConfirmCount+"/"+_scanConfirmNeeded+")";
  if(_scanConfirmCount < _scanConfirmNeeded) return;

  // Confirmed - set timestamp and reset counter
  _lastScanTime = now;
  _lastScannedCode = "";
  _scanConfirmCount = 0;

  if(_scannerMode==="register"){
    // Save UPC to product
    _scannerActive = false;
    document.getElementById("scanner-result").textContent = "✓ Scanned: "+code;
    document.getElementById("scanner-result").style.color = "#22c55e";
    var prod = S.products.find(function(p){ return p.id===_scannerProductId; });
    if(prod){
      prod.upc = code;
      try {
        // Update local state immediately
        var prodIdx = S.products.findIndex(function(p){ return p.id===prod.id; });
        if(prodIdx>=0) S.products[prodIdx].upc = code;
        lsSet("hub:products", S.products);
        // Save to Firebase
        await gs("updateProductUpcServer", {id:prod.id, upc:code});
        setTimeout(function(){
          stopScanner();
          renderInv();
          showToast("Barcode saved for "+prod.name);
        }, 500);
      } catch(e){
        document.getElementById("scanner-result").textContent = "Error saving: "+e.message;
        document.getElementById("scanner-result").style.color = "#ef4444";
        _scannerActive = true;
      }
    }

  } else if(_scannerMode==="lookup"){
    // Quick product lookup
    _scannerActive = false;
    document.getElementById("scanner-result").textContent = "Scanned: "+code+" — searching...";
    // Reload products fresh from Firebase to get latest UPCs
    try {
      var fp2 = await gs("getProductsServer", null);
      if(fp2&&fp2.products) { S.products=fp2.products; lsSet("hub:products",S.products); }
    } catch(e){}
    // Normalize UPC for comparison - strip whitespace and leading zeros
    function normalizeUpc(u){ return String(u||"").trim().replace(/^0+/,""); }
    var codeNorm = normalizeUpc(code);
    var matchedProd = S.products.find(function(p){
      return p.upc && (
        p.upc.trim()===code.trim() ||           // exact match
        normalizeUpc(p.upc)===codeNorm ||        // leading-zero insensitive
        p.upc.trim()===codeNorm ||               // stored without zeros
        normalizeUpc(p.upc)===code.trim()        // scanned without zeros
      );
    });
    if(matchedProd){
      document.getElementById("scanner-result").textContent = "✓ Found: "+matchedProd.name;
      document.getElementById("scanner-result").style.color = "#22c55e";
      setTimeout(function(){ showProductLookup(matchedProd.id); }, 500);
    } else {
      document.getElementById("scanner-result").textContent = "⚠ No product for barcode: "+code+" ("+S.products.filter(function(p){return p.upc;}).length+" registered)";
      document.getElementById("scanner-result").style.color = "#f59e0b";
      _scannerActive = true;
    }
  } else if(_scannerMode==="pull"){
    // Match scanned UPC to order items
    var matched = S.products.find(function(p){ return p.upc===code; });
    if(matched){
      document.getElementById("scanner-result").textContent = "✓ "+matched.name;
      document.getElementById("scanner-result").style.color = "#22c55e";
      if(_scannerCallback) _scannerCallback(matched.id, matched.name, code);
    } else {
      document.getElementById("scanner-result").textContent = "⚠ Product not found for barcode: "+code;
      document.getElementById("scanner-result").style.color = "#f59e0b";
    }
  }
}

function scannerManualOverride(){
  var code = prompt("Enter barcode or product name:");
  if(!code) return;
  if(_scannerMode==="register"){
    onBarcodeScanned(code);
  } else if(_scannerMode==="pull"){
    // Try matching by name
    var matched = S.products.find(function(p){
      return p.upc===code || p.name.toLowerCase().indexOf(code.toLowerCase())>=0;
    });
    if(matched){
      if(_scannerCallback) _scannerCallback(matched.id, matched.name, code);
    } else {
      alert("No product found matching: "+code);
    }
  }
}

        lsSet("hub:cart", S.cart);
        overlay.remove();
        showToast("Added "+qty+" "+prod.unit+" of "+prod.name+" to cart");
      } else {
        delete S.cart[prod.id];
        lsSet("hub:cart", S.cart);
        overlay.remove();
        showToast("Removed "+prod.name+" from cart");
      }
    };
  }
}

  var pending = (S.orders||[]).filter(function(o){ return o.status==="Pending"; }).length;
  var pendSign = S.role==="manager" ? 0 : (S.signRequests||[]).filter(function(r){ return r.status==="Pending"&&r.techName===(S.currentTech||S.managerName); }).length;

  var icons = {
    dashboard:"🏠", inspect:"🚛", inventory:"📦", orders:"🛒",

    reports:"📋", sign:"📝", settings:"⚙️", "__scan__":"📷"
  };

  var nav = document.getElementById("drawer-nav");

// ─── Filter Product List (without full re-render) ────────────────────────────
function filterProductList(){
  var search = (S.checkSearch||"").toLowerCase().trim();
  var starredOnly = S.checkStarredOnly||false;
  if(!S.starredProducts) S.starredProducts={};

  var prods = S.products.filter(function(p){
    if(starredOnly && !S.starredProducts[p.id]) return false;
    if(search && p.name.toLowerCase().indexOf(search)===-1) return false;
    return true;
  }).sort(function(a,b){ return a.name.localeCompare(b.name); });

  var listDiv = document.getElementById("checkout-product-list");
  if(!listDiv) return;

  if(prods.length===0){
    listDiv.innerHTML = "<div style='text-align:center;color:#64748b;padding:40px 20px;'>"
      +(starredOnly?"No starred products yet. Tap ⭐ on any product to star it.":"No products found.")+"</div>";
    return;
  }

  listDiv.innerHTML = prods.map(function(p){
    var starred = S.starredProducts[p.id];
    var inCart = S.cart&&S.cart[p.id]||0;
    var stockColor = p.qty<=0?"#ef4444":p.qty<=p.lowAt?"#f97316":"#22c55e";
    var stockLabel = p.qty<=0?" (OUT)":p.qty<=p.lowAt?" (LOW)":"";
    return "<div style='background:#0f1f38;border:1px solid "+(inCart>0?"#f59e0b":"#1e3a5f")+";border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;'>"
      +"<button type='button' tabindex='-1' data-a='toggle-star-product' data-v='"+p.id+"' style='background:none;border:none;font-size:22px;cursor:pointer;padding:0;flex-shrink:0;touch-action:manipulation;line-height:1;-webkit-tap-highlight-color:transparent;'>"+(starred?"⭐":"☆")+"</button>"
      +"<div style='flex:1;min-width:0;'>"
      +"<div style='font-weight:600;font-size:13px;'>"+esc(p.name)+"</div>"
      +"<div style='font-size:11px;color:"+stockColor+";'>"+p.qty+" "+esc(p.unit)+" on hand"+stockLabel+"</div>"
      +(inCart>0?"<div style='font-size:11px;color:#f59e0b;'>"+inCart+" in cart</div>":"")
      +"</div>"
      +"<div style='display:flex;align-items:center;gap:6px;'>"
      +"<input type='number' min='0' class='inp' style='width:60px;padding:6px;font-size:14px;text-align:center;' placeholder='0' value='"+(inCart>0?inCart:"")+"' data-cart-pid='"+p.id+"'>"
      +"<button type='button' data-a='add-to-cart-direct' data-v='"+p.id+"' style='background:#22c55e;color:#000;border:none;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;touch-action:manipulation;'>+Cart</button>"
      +"</div>"
      +"</div>";
  }).join("");

  // Rewire qty inputs
  listDiv.querySelectorAll("[data-cart-pid]").forEach(function(inp){
    inp.addEventListener("change", function(){
      var pid = inp.getAttribute("data-cart-pid");
      var qty = parseInt(inp.value)||0;
      if(qty>0) S.cart[pid]=qty; else delete S.cart[pid];
      lsSet("hub:cart",S.cart);
      updateCartBadge();
    });
  });
}

// ─── Cart Badge ───────────────────────────────────────────────────────────────
function updateCartBadge(){
  var cartBtn = document.getElementById("cart-hdr-btn");
  var cartBadge = document.getElementById("cart-hdr-badge");
  if(!cartBtn) return;
  var cartCount = 0;
  try { cartCount = Object.keys(S.cart||{}).filter(function(k){ return parseInt(S.cart[k]||0)>0; }).length; } catch(e){}
  if(cartCount > 0){
    cartBtn.style.display = "inline-flex";
    cartBtn.style.alignItems = "center";
    cartBtn.style.justifyContent = "center";
    cartBtn.style.position = "relative";
    if(cartBadge) cartBadge.textContent = cartCount;
  } else {
    cartBtn.style.display = "none";
  }
}

// ─── Reports ──────────────────────────────────────────────────────────────────
async function renderReports(){
  var pg = document.getElementById("pg-reports");
  if(!pg) return;
  pg.innerHTML = "<h2 style='font-size:20px;font-weight:700;margin-bottom:4px;'>Reports</h2>"
    +"<p style='color:#475569;font-size:13px;margin-bottom:20px;'>Product usage, inventory, and order history</p>"
    +"<div style='text-align:center;padding:20px;color:#64748b;'>Loading...</div>";

  // Load data
  try {
    var adjLog = S._cachedAdjLog;
    var orderHist = S._cachedOrderHistory;
    if(!adjLog){
      var adjResult = await gs("getAdjustmentLog", null);
      adjLog = adjResult && adjResult.log ? adjResult.log : [];
      S._cachedAdjLog = adjLog;
    }
    if(!orderHist){
      var ohResult = await gs("getOrderHistory", null);
      orderHist = ohResult && ohResult.orders ? ohResult.orders : [];
      S._cachedOrderHistory = orderHist;
    }

    var S_repDateRange = S._repDateRange||"30";
    var S_repTech = S._repTech||"";
    var S_repProduct = S._repProduct||"";

    // Date filter
    var now = new Date();
    var cutoff;
    if(S_repDateRange==="custom" && S._repDateFrom){
      cutoff = new Date(S._repDateFrom);
    } else {
      cutoff = new Date(now - parseInt(S_repDateRange||"30")*24*60*60*1000);
    }
    var cutoffEnd = (S_repDateRange==="custom" && S._repDateTo) ? new Date(S._repDateTo) : now;

    // Filter adjustment log
    var filtered = adjLog.filter(function(row){
      var d = new Date(row[0]||"");
      if(isNaN(d)) return false;
      if(d < cutoff) return false;
      if(d > cutoffEnd) return false;
      if(S_repTech && row[6] !== S_repTech) return false;
      if(S_repProduct && row[1] !== S_repProduct) return false;
      return true;
    });

    // Aggregate by product
    var byProduct = {};
    filtered.forEach(function(row){
      var name = row[1]||"Unknown";
      var change = parseFloat(row[5])||0;
      if(!byProduct[name]) byProduct[name]={name:name, used:0, added:0, count:0};
      if(change < 0) byProduct[name].used += Math.abs(change);
      else byProduct[name].added += change;
      byProduct[name].count++;
    });

    var prodList = Object.values(byProduct).sort(function(a,b){ return b.used-a.used; });

    // Aggregate by tech
    var byTech = {};
    filtered.forEach(function(row){
      var tech = row[6]||"Unknown";
      var change = parseFloat(row[5])||0;
      if(!byTech[tech]) byTech[tech]={name:tech, used:0, count:0};
      if(change < 0) byTech[tech].used += Math.abs(change);
      byTech[tech].count++;
    });
    var techList = Object.values(byTech).sort(function(a,b){ return b.used-a.used; });

    // Get techs from S.techs (already loaded) + any in adj log
    var allTechsSet = new Set(S.techs||[]);
    adjLog.forEach(function(r){ if(r[6]) allTechsSet.add(r[6]); });
    var allTechs = Array.from(allTechsSet).filter(Boolean).sort();

    // Get products from S.products (already loaded) + any in adj log
    var allProdsSet = new Set((S.products||[]).map(function(p){ return p.name; }));
    adjLog.forEach(function(r){ if(r[1]) allProdsSet.add(r[1]); });
    var allProds = Array.from(allProdsSet).filter(Boolean).sort();

    // Current stock value
    var lowStock = S.products.filter(function(p){ return p.qty<=p.lowAt; });
    var outStock = S.products.filter(function(p){ return p.qty<=0; });

    pg.innerHTML = "<h2 style='font-size:20px;font-weight:700;margin-bottom:4px;'>Reports</h2>"
      +"<p style='color:#475569;font-size:13px;margin-bottom:20px;'>Product usage, inventory, and order history</p>"

      // Filters
      +"<div class='card' style='margin-bottom:20px;'>"
      +"<div style='font-weight:700;font-size:13px;color:#f59e0b;margin-bottom:12px;'>🔍 Filters</div>"
      +"<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;'>"
      +"<div><label style='font-size:11px;color:#64748b;display:block;margin-bottom:4px;'>DATE RANGE</label>"
      +"<select class='inp' id='rep-date-range'>"
      +"<option value='7'"+(S_repDateRange==="7"?" selected":"")+">Last 7 days</option>"
      +"<option value='30'"+(S_repDateRange==="30"?" selected":"")+">Last 30 days</option>"
      +"<option value='60'"+(S_repDateRange==="60"?" selected":"")+">Last 60 days</option>"
      +"<option value='90'"+(S_repDateRange==="90"?" selected":"")+">Last 90 days</option>"
      +"<option value='365'"+(S_repDateRange==="365"?" selected":"")+">Last year</option>"
      +"<option value='custom'"+(S_repDateRange==="custom"?" selected":"")+">Custom range...</option>"
      +"</select>"
      +(S_repDateRange==="custom"
        ?"<div style='display:flex;gap:6px;margin-top:6px;'>"
        +"<input type='date' class='inp' id='rep-date-from' style='flex:1;font-size:12px;' value='"+(S._repDateFrom||"")+"'>"
        +"<input type='date' class='inp' id='rep-date-to' style='flex:1;font-size:12px;' value='"+(S._repDateTo||"")+"'>"
        +"</div>"
        :"")
      +"</div>"
      +"<div><label style='font-size:11px;color:#64748b;display:block;margin-bottom:4px;'>TECHNICIAN</label>"
      +"<select class='inp' id='rep-tech'>"
      +"<option value=''>All Techs</option>"
      +allTechs.map(function(t){ return "<option value='"+esc(t)+"'"+(S_repTech===t?" selected":"")+">"+esc(t)+"</option>"; }).join("")
      +"</select></div>"
      +"<div><label style='font-size:11px;color:#64748b;display:block;margin-bottom:4px;'>PRODUCT</label>"
      +"<select class='inp' id='rep-product'>"
      +"<option value=''>All Products</option>"
      +allProds.map(function(p){ return "<option value='"+esc(p)+"'"+(S_repProduct===p?" selected":"")+">"+esc(p)+"</option>"; }).join("")
      +"</select></div>"
      +"</div>"
      +"<div style='margin-top:10px;font-size:12px;color:#64748b;'>"+filtered.length+" adjustment records found for selected filters."
      +"  <button class='btn bg' style='padding:4px 10px;font-size:11px;margin-left:8px;' data-a='reports-refresh'>↻ Refresh</button>"
      +"</div></div>";

    // Wire up filter selects
    setTimeout(function(){
      var dr = document.getElementById("rep-date-range");
      var rt = document.getElementById("rep-tech");
      var rp = document.getElementById("rep-product");
      if(dr) dr.onchange = function(){ S._repDateRange=this.value; renderReports(); };
      if(rt) rt.onchange = function(){ S._repTech=this.value; renderReports(); };
      if(rp) rp.onchange = function(){ S._repProduct=this.value; renderReports(); };
      var df = document.getElementById("rep-date-from");
      var dt = document.getElementById("rep-date-to");
      if(df) df.onchange = function(){ S._repDateFrom=this.value; renderReports(); };
      if(dt) dt.onchange = function(){ S._repDateTo=this.value; renderReports(); };
    }, 100);

    pg.innerHTML += ""

      // Inventory snapshot
      +"<div class='desk-grid' style='margin-bottom:20px;'>"
      +"<div class='card'>"
      +"<div style='font-weight:700;font-size:13px;color:#f59e0b;margin-bottom:12px;'>📦 Inventory Snapshot</div>"
      +"<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center;margin-bottom:12px;'>"
      +"<div><div style='font-size:24px;font-weight:700;color:#3b82f6;'>"+S.products.length+"</div><div style='font-size:11px;color:#64748b;'>Total Products</div></div>"

// ─── Remove Product from Inventory ───────────────────────────────────────────
async function removeProd(id){
  const p = S.products.find(function(x){return x.id===id;});
  if(!p) return;
  // If no row number, sync first to get it
  if(!p.row){
    alert("Product row number unknown. Please tap Sync first to refresh sheet data, then try removing again.");
    return;
  }
  if(!confirm("Remove "+p.name+" from inventory? This will remove it from both the app and the sheet.")) return;
  // Remove from sheet FIRST before updating app
  try {
    const result = await gs("removeProductFromSheetServer",{row:p.row});
    if(result && result.ok){
      S.products = S.products.filter(function(x){return x.id!==id;});
      S._restockId=null; S._adjId=null;
      save(); renderInv();
    } else {
      alert("Could not remove from sheet. Please sync and try again.");
    }
  } catch(e){
    console.warn("Remove from sheet:",e);
    alert("Error: "+e.message);
  }
}

// ─── Add Product to Inventory ─────────────────────────────────────────────────
async function invAddProduct(){
  const name = (document.getElementById("new-prod-name")||{}).value||"";
  const unit = (document.getElementById("new-prod-unit")||{}).value||"each";
  const qty  = parseInt((document.getElementById("new-prod-qty")||{}).value)||0;
  const lowAt= parseInt((document.getElementById("new-prod-lowat")||{}).value)||0;
  if(!name.trim()){alert("Please enter a product name.");return;}
  // Add to local products
  const newProd = {id:"sheet_new_"+Date.now(), name:name.trim(), unit:unit.trim(), qty:qty, lowAt:lowAt, reorderNote:"", truckWarnAbove:0, row:null};
  S.products.push(newProd);
  // Sort alphabetically
  S.products.sort(function(a,b){ return a.name.toLowerCase().localeCompare(b.name.toLowerCase()); });
  S._showAddProd = false;
  save();
  renderInv();
  // Write to sheet
  try {
    const result = await gs("addProductToSheetServer", {name:name.trim(), unit:unit.trim(), qty:qty, lowAt:lowAt});
    if(result && result.row){
      const p = S.products.find(function(p){return p.id===newProd.id;});
      if(p){ p.id="sheet_"+result.row; p.row=result.row; save(); }
    } else if(result && result.error){
      alert("Could not add to sheet: "+result.error);
    }
  } catch(e){
    alert("Error adding to sheet: "+e.message);
  }
}

function renderTruckInvManager(pg){
  var techNames = Object.keys(S.truckInventories);
  if(techNames.length === 0){
    pg.innerHTML = "<h2 style='font-size:20px;font-weight:700;margin-bottom:16px;'>Truck Inventories</h2>"
      +"<div style='text-align:center;color:#475569;padding:40px;'>"
      +"<div style='font-size:36px;margin-bottom:12px;'>&#x1F69A;</div>"
      +"<p>No truck inventories submitted yet.</p>"
      +"<p style='font-size:13px;margin-top:8px;'>Techs submit their first inventory from the My Truck tab.</p></div>";
    return;
  }

  var cards = techNames.map(function(techName){
    var inv = S.truckInventories[techName];
    var lastDate = inv.lastSubmit ? fd(inv.lastSubmit) : "Never";
    var daysSince = inv.lastSubmit ? Math.floor((Date.now()-new Date(inv.lastSubmit).getTime())/(1000*60*60*24)) : 999;
    var stale = daysSince > 8;
    var variances = (inv.products||[]).filter(function(p){ return p.prevQty>0 && p.qty < p.prevQty*0.5; });

    var prodRows = (inv.products||[]).map(function(p){
      var change = p.prevQty !== undefined ? p.qty - p.prevQty : null;
      var isVar = p.prevQty > 0 && p.qty < p.prevQty * 0.5;
      var changeHtml = change !== null
        ? "<span style='font-size:12px;color:"+(change<0?"#ef4444":change>0?"#22c55e":"#475569")+";'>"+(change>0?"+":"")+change+"</span>"
        : "";
      return "<div style='display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #0a1628;'>"
        +"<span style='font-size:13px;"+(isVar?"color:#f97316;font-weight:600;":"")+"'>"+esc(p.name)+"</span>"
        +"<div style='display:flex;align-items:center;gap:10px;'>"+changeHtml
        +"<span style='font-family:monospace;font-weight:700;color:"+(isVar?"#f97316":"#e2e8f0")+";'>"+p.qty+" "+esc(p.unit)+"</span>"
        +"</div></div>";
    }).join("");

    var badges = (stale ? "<span style='padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#431407;color:#fb923c;'>Overdue</span>" : "")
      + (variances.length>0 ? "<span style='padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#1c0a00;color:#f97316;'>"+variances.length+" variance"+(variances.length>1?"s":"")+"</span>" : "");

    return "<div class='card' style='margin-bottom:12px;"+(variances.length>0?"border-color:#c2410c30;":"")+"'>"
      +"<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;'>"
      +"<div><div style='font-weight:700;font-size:16px;'>"+esc(techName)+"</div>"
      +"<div style='font-size:12px;color:#64748b;margin-top:2px;'>"+esc(inv.truck||"")+" &bull; Last count: "+lastDate+"</div></div>"
      +"<div style='display:flex;flex-direction:column;align-items:flex-end;gap:4px;'>"+badges+"</div></div>"
      +"<div>"+(prodRows||"<div style='color:#475569;font-size:13px;'>No products recorded.</div>")+"</div></div>";
  }).join("");

  pg.innerHTML = "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;'>"
    +"<h2 style='font-size:20px;font-weight:700;'>Truck Inventories</h2>"
    +"<span style='font-size:12px;color:#475569;'>"+techNames.length+" truck"+(techNames.length!==1?"s":"")+"</span></div>"
    +"<p style='color:#475569;font-size:13px;margin-bottom:16px;'>Weekly counts submitted by technicians. Variances flagged when a product drops more than 50% from the previous week.</p>"
    +cards;
}

  if(!prod) return;
  var qtyInp = document.getElementById("ti-add-qty");

  var techName = S.currentUser ? S.currentUser.name : S.checkTech;
  if(!S.truckInventories[techName]) S.truckInventories[techName]={truck:"",products:[],lastSubmit:null};
  S.truckInventories[techName].products.push({id:prod.id,name:prod.name,unit:prod.unit,qty:qty,prevQty:0,warnBelow:0});
  save(); renderTruckInv();
}

function tiRemoveProd(idx){
  var techName = S.currentUser ? S.currentUser.name : S.checkTech;
  if(!S.truckInventories[techName]) return;
  S.truckInventories[techName].products.splice(parseInt(idx),1);
  save(); renderTruckInv();
}

async function tiSubmit(){
  var techName = S.currentUser ? S.currentUser.name : S.checkTech;
  if(!techName){ alert("Could not identify technician."); return; }

  // Get truck selection
  var truckSel = document.getElementById("ti-truck-select");
  var truck = truckSel ? truckSel.value : (S.truckInventories[techName]||{}).truck||"";
  if(!truck){ alert("Please select your truck first."); return; }

  if(!S.truckInventories[techName]) S.truckInventories[techName]={truck:"",products:[],lastSubmit:null};
  var inv = S.truckInventories[techName];
  inv.truck = truck;

  // Read current qty values from inputs
  var variances = [];
  (inv.products||[]).forEach(function(p, i){
    var inp = document.getElementById("ti-qty-"+i);
    if(inp){
      var newQty = parseInt(inp.value)||0;
      var prev = p.qty;
      // Check variance - more than 50% drop
      if(prev > 0 && newQty < prev * 0.5){
        variances.push({name:p.name, prev:prev, current:newQty, unit:p.unit, drop:Math.round((1-(newQty/prev))*100)});
      }
      p.prevQty = prev;
      p.qty = newQty;
    }
  });

  inv.lastSubmit = new Date().toISOString();
  save();

  // Log to sheet BEFORE re-rendering
  var rows = (inv.products||[]).map(function(p){
    return [new Date().toLocaleDateString("en-US"), techName, truck||inv.truck||"", p.name, p.unit, p.qty, p.prevQty||0, p.qty-(p.prevQty||0)];
  });
  if(rows.length > 0){
    try {
      await gs("logTruckInventoryServer", {rows:rows, headers:["Date","Technician","Truck","Product","Unit","Qty","Prev Qty","Change"]});
    } catch(e){ console.warn("Sheet log:", e); }
  }

  renderTruckInv();

  // Send variance email if needed
  if(variances.length > 0){
    var varList = variances.map(function(v){ return "  - "+v.name+": was "+v.prev+" "+v.unit+", now "+v.current+" "+v.unit+" ("+v.drop+"% drop)"; }).join("\n");
    var emailBody = "Truck Inventory Variance Alert - Fox Pest Control Willamette Valley\n\n"
      +"Technician: "+techName+"\nTruck: "+truck+"\nDate: "+new Date().toLocaleDateString("en-US")+"\n\n"
      +"The following products dropped more than 50% from last week:\n"+varList
      +"\n\nPlease review with the technician.\n\nAutomated notification from Fox Admin Hub.";
    try {
      await gs("sendEmailServer", {
        to: getMGMT().join(","),
        subject: "[Fox Pest Control] Truck Inventory Variance - "+techName+" - "+variances.length+" item"+(variances.length>1?"s":""),
        body: emailBody
      });
    } catch(e){ console.warn("Email:", e); }
    alert("Inventory submitted! Note: "+variances.length+" variance"+(variances.length>1?"s were":"was")+" detected and reported to management.");
  } else {
    alert("Inventory submitted successfully!");
  }
}

function snapshotRestockQtys(){
  // Save current qty inputs for low stock items into state
  if(!S._restockQtys) S._restockQtys={};
  var lowStock = S.products.filter(function(p){ return p.qty<=p.lowAt; });
  lowStock.forEach(function(p){
    var qtyInp = document.getElementById("rs-qty-"+p.id);

async function restockSendEmail(){
  const lowStock = S.products.filter(function(p){ return p.qty<=p.lowAt; });
  const notes = (document.getElementById("rs-notes")||{}).value||"";
  S._restockNotes = notes;
  const selectedItems = [];

  var missingQty = [];
  lowStock.forEach(function(p){
    const cb = document.getElementById("rs-"+p.id);
    // Only include if checkbox exists AND is checked
    if(!cb) return;
    if(!cb.checked) return; // explicitly unchecked - skip entirely
    const qtyInp = document.getElementById("rs-qty-"+p.id);
    const qty = parseInt(qtyInp?qtyInp.value:"")||0;
    if(qty <= 0){
      missingQty.push(p.name);
    } else {
      selectedItems.push({id:p.id,name:p.name,unit:p.unit,qtyOrdered:qty,onHand:p.qty});
    }
  });
  if(missingQty.length > 0){
    const proceed = confirm("The following checked items have no order quantity entered:\n\n- "+missingQty.join("\n- ")+"\n\nThey will be skipped. Continue?");
    if(!proceed) return;
  }
  (S._restockExtras||[]).forEach(function(e){
    selectedItems.push({id:e.id,name:e.name,unit:e.unit,qtyOrdered:e.qty,onHand:e.onHand||0});
  });

  if(selectedItems.length===0){ alert("Please select at least one product."); return; }

  const date = new Date().toISOString();
  const orderId = "RST-"+Date.now();
  const order = {id:orderId,date,sentBy:S.managerName,items:selectedItems,status:"Pending",notes};
  S.restockOrders.unshift(order);
  save();
  // Save to restock orders sheet
  try { await gs("saveRestockOrderServer", {order:order}); } catch(e){ console.warn("Save restock order:", e); }
  // Write to order spreadsheet
  try {
    const orderResult = await gs("writeToOrderSheetServer", {items:selectedItems});
    if(orderResult&&orderResult.ok){
      if(orderResult.notFound&&orderResult.notFound.length>0){
        alert("Restock request sent!\n\nNote: The following products were not found in the order spreadsheet and need to be added manually:\n\n- "+orderResult.notFound.join("\n- "));
      }
    } else {
      console.warn("Order sheet write failed:", orderResult?orderResult.error:"no response");
    }
  } catch(e){ console.warn("Write to order sheet:", e); }

  const itemList = selectedItems.map(function(i){
    return "  - "+i.name+": "+i.onHand+" "+i.unit+" on hand, ordering "+i.qtyOrdered;
  }).join("\n");

  const body = "Restock Request - Fox Pest Control Willamette Valley\n\n"
    +"From: "+S.managerName+"\nDate: "+new Date(date).toLocaleDateString("en-US")+"\nOrder ID: "+orderId+"\n\n"
    +"Products to Restock:\n"+itemList+"\n\n"
    +(notes?"Additional Notes:\n"+notes+"\n\n":"")
    +"Please place this order at your earliest convenience.\n\nFox Pest Control Admin Hub";

  try {
    await gs("sendEmailServer",{
      to:"rockey.martin@fox-marketingservices.com,john.kluttz@fox-marketingservices.com",
      subject:"[Fox Pest Control] Restock Request - "+selectedItems.length+" item"+(selectedItems.length>1?"s":"")+" - "+S.managerName,
      body:body
    });
    S._restockSent=true;
    S._restockExtras=[];
    S._restockNotes="";
    S._restockSelected={};
    renderRestock();
  } catch(e){ alert("Could not send: "+e.message); }
}

async function restockSubmitReceive(){
  const order = S._receivingOrder;
  if(!order) return;
  const received=[], missing=[], backordered=[];

  for(var i=0; i<order.items.length; i++){
    var item = order.items[i];
    var got = parseInt((document.getElementById("rcv-got-"+item.id)||{}).value)||0;
    var miss = parseInt((document.getElementById("rcv-miss-"+item.id)||{}).value)||0;
    var back = parseInt((document.getElementById("rcv-back-"+item.id)||{}).value)||0;

    if(got>0){
      received.push({...item, qtyReceived:got});
      // Add to inventory
      var prod = S.products.find(function(p){ return p.id===item.id; });
      if(prod){
        var oldQty=prod.qty;
        prod.qty+=got;
        try {
          await gs("updateQtyServer",{row:prod.row,qty:prod.qty});
          await gs("logAdjustmentServer",{product:prod.name,unit:prod.unit,oldQty,newQty:prod.qty,manager:S.managerName,reason:"Restock Received - Order "+order.id.slice(-6)});
        } catch(e){}
      }
    }
    if(miss>0) missing.push({...item, qtyMissing:miss});
    if(back>0) backordered.push({...item, qtyOrdered:back});
  }

  // Update order status
  const idx = S.restockOrders.findIndex(function(o){ return o.id===order.id; });
  if(idx>=0){
    S.restockOrders[idx].status = backordered.length>0||missing.length>0 ? "Partial" : "Received";
    S.restockOrders[idx].receivedDate = new Date().toISOString();
    S.restockOrders[idx].received = received;
    S.restockOrders[idx].missing = missing;
    S.restockOrders[idx].backordered = backordered;
  }

  // Create new restock order for backordered items
  if(backordered.length>0){
    const backOrder = {
      id:"RST-"+Date.now(),
      date:new Date().toISOString(),
      sentBy:S.managerName,
      items:backordered,
      status:"Backordered",
      notes:"Backordered from Order "+order.id.slice(-6)
    };
    S.restockOrders.unshift(backOrder);
  }

  save();
  // Update order in sheet
  try { await gs("updateRestockOrderServer", {
    orderId: order.id,
    status: S.restockOrders[idx]?S.restockOrders[idx].status:"Partial",
    receivedDate: new Date().toISOString(),
    received: received,
    missing: missing,
    backordered: backordered
  }); } catch(e){ console.warn("Update restock order:", e); }
  // Save backordered order to sheet too
  if(backordered.length>0){
    try { await gs("saveRestockOrderServer", {order:S.restockOrders[0]}); } catch(e){}
  }

  // Send ONE email to Rockey summarizing everything
  var emailLines=[];

    +"Fox Pest Control Admin Hub - Willamette Valley Branch";

async function renderAnalytics(){
  const pg = document.getElementById("pg-analytics");
  if(!pg) return;

  var view = S._analyticsView || "planner";
  var target = S.analyticsTarget || 30;

  var navHtml = "<div style='display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;'>"
    +"<button class='btn "+(view==="planner"?"bp":"bg")+"' style='font-size:12px;padding:6px 12px;' data-a='analytics-view' data-v='planner'>&#x1F4CB; Order Planner</button>"
    +"<button class='btn "+(view==="timeline"?"bp":"bg")+"' style='font-size:12px;padding:6px 12px;' data-a='analytics-view' data-v='timeline'>&#x1F4C5; Usage Timeline</button>"
    +"<button class='btn "+(view==="techs"?"bp":"bg")+"' style='font-size:12px;padding:6px 12px;' data-a='analytics-view' data-v='techs'>&#x1F464; Tech Usage</button>"
    +"<div style='display:flex;gap:6px;margin-left:auto;'>"
    +"<button class='btn bg' style='font-size:12px;padding:6px 12px;' data-a='analytics-print'>&#x1F5A8;</button>"
    +"<button class='btn bg' style='font-size:12px;padding:6px 12px;' data-a='analytics-refresh'>&#x21BB;</button>"
    +"</div></div>";

  pg.innerHTML = "<h2 style='font-size:20px;font-weight:700;margin-bottom:12px;'>Analytics</h2>"
    +navHtml+"<div style='text-align:center;padding:40px;color:#475569;'>&#x23F3; Loading...</div>";

  try {
    // Use cached data if available, only reload on explicit refresh
    var adjustments = S._cachedAdjLog || [];
    var orders = S._cachedOrderHistory || [];

    if(adjustments.length === 0){
      var adjData = await gs("getAdjustmentLogServer", null);
      adjustments = adjData && adjData.log ? adjData.log : [];
      S._cachedAdjLog = adjustments;
    }
    if(orders.length === 0){
      var orderData = await gs("getOrderHistoryServer", null);
      orders = orderData && orderData.orders ? orderData.orders : [];
      S._cachedOrderHistory = orders;
    }

    var now = new Date();
    var nowTs = now.getTime();

    var prodMap = {};
    function ensureProd(name, unit){ if(!prodMap[name]) prodMap[name]={name:name,unit:unit,months:{},techMonths:{}}; }

    var skipWords = ["audit","correction","weekly","count","return","damage","loss","restock received","warehouse"];

    adjustments.forEach(function(row){
      var dateVal=row[0], product=row[1], unit=row[2];
      var change=parseFloat(row[5])||0;
      var reason=String(row[7]||"").toLowerCase();
      if(!product||!dateVal||change>=0) return;
      for(var si=0;si<skipWords.length;si++){ if(reason.includes(skipWords[si])) return; }
      // Handle both string dates and JS Date objects from sheets
      var d = dateVal instanceof Date ? dateVal : new Date(dateVal);
      if(isNaN(d.getTime())) return;
      // Use UTC to avoid timezone issues with ISO strings
      var monthKey=d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");
      ensureProd(product,unit);
      prodMap[product].months[monthKey]=(prodMap[product].months[monthKey]||0)+Math.abs(change);
    });

    orders.forEach(function(row){
      var dateVal=row[0], tech=String(row[2]||""), product=row[3];
      var qty=parseFloat(row[4])||0, unit=row[5];
      if(!product||!qty||!dateVal) return;
      var d = dateVal instanceof Date ? dateVal : new Date(dateVal);
      if(isNaN(d.getTime())) return;
      var monthKey=d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");
      ensureProd(product,unit);
      prodMap[product].months[monthKey]=(prodMap[product].months[monthKey]||0)+qty;
      if(tech){
        if(!prodMap[product].techMonths[tech]) prodMap[product].techMonths[tech]={};
        prodMap[product].techMonths[tech][monthKey]=(prodMap[product].techMonths[tech][monthKey]||0)+qty;
      }
    });

    // Build month buckets based on selected avg period
    var avgDays2 = S.analyticsAvgDays||90;
    var avgMonths = Math.ceil(avgDays2/30);
    var last3=[];
    for(var mi=0;mi<avgMonths;mi++){
      var d2=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-mi,1));
      last3.push(d2.getUTCFullYear()+"-"+String(d2.getUTCMonth()+1).padStart(2,"0"));
    }
    console.log("Looking for months:", last3);
    console.log("Months found in data:", Object.keys(prodMap).length>0 ? Object.keys(prodMap[Object.keys(prodMap)[0]].months) : "none");

    var allMonths={};
    Object.keys(prodMap).forEach(function(p){ Object.keys(prodMap[p].months).forEach(function(m){ allMonths[m]=1; }); });
    var sortedMonths=Object.keys(allMonths).sort();

    if(view==="planner"){
      var avgDays = S.analyticsAvgDays||90;
      var targetOpts=[{days:14,label:"2 Weeks"},{days:30,label:"1 Month"},{days:45,label:"1.5 Months"},{days:60,label:"2 Months"},{days:90,label:"3 Months"}];
      var avgOpts=[{days:30,label:"30 Days"},{days:60,label:"60 Days"},{days:90,label:"90 Days"}];
      var targetBar="<div style='margin-bottom:12px;'>"
        +"<div style='display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;'>"
        +"<span style='font-size:12px;color:#64748b;font-weight:600;white-space:nowrap;min-width:90px;'>Target Supply:</span>"
        +targetOpts.map(function(t){ return "<button class='btn "+(target===t.days?"bp":"bg")+"' style='padding:4px 10px;font-size:12px;' data-a='set-analytics-target' data-v='"+t.days+"'>"+t.label+"</button>"; }).join("")
        +"</div>"
        +"<div style='display:flex;align-items:center;gap:6px;flex-wrap:wrap;'>"
        +"<span style='font-size:12px;color:#64748b;font-weight:600;white-space:nowrap;min-width:90px;'>Avg Period:</span>"
        +avgOpts.map(function(t){ return "<button class='btn "+(avgDays===t.days?"bp":"bg")+"' style='padding:4px 10px;font-size:12px;' data-a='set-analytics-avg' data-v='"+t.days+"'>"+t.label+"</button>"; }).join("")
        +"</div></div>";

      var plannerRows=S.products.map(function(p){
        var pm=prodMap[p.name]||{months:{},techMonths:{}};
        var total3=last3.reduce(function(sum,m){ return sum+(pm.months[m]||0); },0);
        var avg3=total3/last3.length;
        var dailyRate=avg3/30;
        var daysLeft=dailyRate>0?Math.round(p.qty/dailyRate):null;
        var suggestedQty=Math.max(0,Math.round((dailyRate*target)-p.qty));
        var lastMonth=last3[0], prevMonth=last3[1];
        var lastUsed=pm.months[lastMonth]||0, prevUsed=pm.months[prevMonth]||0;
        var trend=lastUsed>prevUsed*1.1?"up":lastUsed<prevUsed*0.9?"down":"flat";
        var trendIcon=trend==="up"?"&#x2191;":trend==="down"?"&#x2193;":"&#x2192;";
        var trendColor=trend==="up"?"#ef4444":trend==="down"?"#22c55e":"#64748b";
        var daysColor=daysLeft===null?"#64748b":daysLeft<14?"#ef4444":daysLeft<30?"#f59e0b":"#22c55e";
        var daysText=daysLeft===null?"N/A":daysLeft+" days";
        var barPct=daysLeft!==null?Math.min(100,Math.round((daysLeft/target)*100)):avg3>0?50:10;
        var barColor=barPct>66?"#22c55e":barPct>33?"#f59e0b":"#ef4444";
        if(avg3===0&&p.qty>p.lowAt) return "";
        return "<div class='card' style='margin-bottom:8px;padding:14px;"+(suggestedQty>0?"border-left:3px solid #f59e0b;":"")+"'>"
          +"<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;'>"
          +"<div style='font-weight:600;font-size:14px;'>"+esc(p.name)+"</div>"
          +"<span style='font-size:12px;color:"+trendColor+";font-weight:600;'>"+trendIcon+" usage</span></div>"
          +"<div style='background:#0a1628;border-radius:4px;height:6px;margin-bottom:8px;'>"
          +"<div style='background:"+barColor+";border-radius:4px;height:6px;width:"+barPct+"%;'></div></div>"
          +"<div style='display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;'>"
          +"<div><div style='color:#64748b;'>On Hand</div><div style='font-weight:700;color:#e2e8f0;'>"+p.qty+" "+esc(p.unit)+"</div></div>"
          +"<div><div style='color:#64748b;'>Avg/Month</div><div style='font-weight:700;color:#e2e8f0;'>"+Math.round(avg3)+" "+esc(p.unit)+"</div></div>"
          +"<div><div style='color:#64748b;'>Days Left</div><div style='font-weight:700;color:"+daysColor+";'>"+daysText+"</div></div>"
          +"</div>"
          +(suggestedQty>0?"<div style='margin-top:8px;padding:6px 10px;background:#1c2d1a;border-radius:6px;border:1px solid #22c55e30;display:flex;justify-content:space-between;align-items:center;'>"
            +"<span style='font-size:12px;color:#94a3b8;'>Suggested order:</span>"
            +"<span style='font-weight:700;font-size:15px;color:#f59e0b;'>"+suggestedQty+" "+esc(p.unit)+"</span></div>":"")
          +"</div>";
      }).filter(Boolean).join("");

      var needOrder=S.products.filter(function(p){
        var pm2=prodMap[p.name]||{months:{}};
        var avg=last3.reduce(function(s,m){return s+(pm2.months[m]||0);},0)/3;
        return Math.max(0,Math.round((avg/30*target)-p.qty))>0;
      });

      var summaryBar="<div style='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;'>"
        +"<div class='card' style='padding:14px;text-align:center;'><div style='font-size:28px;font-weight:700;color:#f59e0b;'>"+needOrder.length+"</div><div style='font-size:12px;color:#64748b;'>Products to Order</div></div>"
        +"<div class='card' style='padding:14px;text-align:center;'><div style='font-size:28px;font-weight:700;color:#3b82f6;'>"+target+"</div><div style='font-size:12px;color:#64748b;'>Day Target Supply</div></div>"
        +"</div>";

      var sendBtn=needOrder.length>0?"<button class='btn bp' style='width:100%;padding:12px;font-size:14px;margin-bottom:16px;' data-a='analytics-to-restock'>&#x1F4E4; Send Suggested Order to Restock Tab</button>":"";

      pg.innerHTML="<h2 style='font-size:20px;font-weight:700;margin-bottom:12px;'>Analytics</h2>"
        +navHtml+targetBar+summaryBar+sendBtn
        +(plannerRows||"<div class='card' style='padding:30px;text-align:center;color:#475569;'><div style='font-size:32px;margin-bottom:10px;'>&#x1F4CA;</div><p>Not enough usage data yet.</p><p style='font-size:12px;margin-top:6px;'>Usage data builds up over time from approved orders and inventory adjustments.</p></div>");

    } else if(view==="timeline"){
      var recentMonths=sortedMonths.slice(-6);
      var prodRows2=Object.keys(prodMap).sort().map(function(pname){
        var pm=prodMap[pname];
        if(!recentMonths.some(function(m){ return (pm.months[m]||0)>0; })) return "";
        var maxQty=Math.max.apply(null,recentMonths.map(function(m){ return pm.months[m]||0; }))||1;
        var monthCells=recentMonths.map(function(m){
          var qty=pm.months[m]||0;
          var pct=Math.round((qty/maxQty)*100);
          var col=qty===0?"#1e3a5f":pct>66?"#ef4444":pct>33?"#f59e0b":"#3b82f6";

        }).join("");
        return "<tr style='border-bottom:1px solid #0a1628;'><td style='padding:8px 4px;font-size:12px;font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;'>"+esc(pname)+"</td>"+monthCells+"</tr>";
      }).filter(Boolean).join("");

      var monthHeaders=recentMonths.map(function(m){
        var parts=m.split("-");
        var d3=new Date(parseInt(parts[0]),parseInt(parts[1])-1,1);
        return "<th style='padding:6px 4px;text-align:center;font-size:11px;color:#64748b;font-weight:600;'>"+d3.toLocaleDateString("en-US",{month:"short",year:"2-digit"})+"</th>";
      }).join("");

      pg.innerHTML="<h2 style='font-size:20px;font-weight:700;margin-bottom:12px;'>Analytics</h2>"
        +navHtml
        +"<p style='color:#475569;font-size:13px;margin-bottom:16px;'>Monthly usage per product — last 6 months.</p>"
        +(prodRows2?"<div style='overflow-x:auto;'><table style='width:100%;border-collapse:collapse;font-size:13px;'><thead><tr style='border-bottom:2px solid #1e3a5f;'><th style='padding:6px 4px;text-align:left;font-size:11px;color:#64748b;'>Product</th>"+monthHeaders+"</tr></thead><tbody>"+prodRows2+"</tbody></table></div>"
          :"<div class='card' style='padding:30px;text-align:center;color:#475569;'>No usage data yet.</div>");

    } else if(view==="techs"){

        Object.keys(prodMap[pname].techMonths).forEach(function(tech){
          if(!techMap[tech]) techMap[tech]={name:tech,products:{}};
          Object.keys(prodMap[pname].techMonths[tech]).forEach(function(m){
            techMap[tech].products[pname]=(techMap[tech].products[pname]||0)+(prodMap[pname].techMonths[tech][m]||0);
          });
        });
      });

      var techCards=Object.keys(techMap).sort().map(function(tech){

        var prodList=topProds.map(function(p){

        }).join("");

          +"<div style='display:flex;align-items:center;justify-content:space-between;cursor:pointer;' data-a='toggle-tech-usage' data-v='"+tech+"'>"
          +"<div><div style='font-weight:700;font-size:15px;'>"+esc(tech)+"</div>"
          +"<div style='font-size:12px;color:#64748b;margin-top:2px;'>"+Object.keys(t.products).length+" products used total</div></div>"
          +"<span style='color:#64748b;font-size:16px;'>"+(expanded?"&#x25B2;":"&#x25BC;")+"</span></div>"
          +(expanded?"<div style='margin-top:10px;padding-top:10px;border-top:1px solid #1e3a5f;'><div style='font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;margin-bottom:6px;'>Top Products (All Time)</div>"+prodList+"</div>":"")
          +"</div>";
      }).join("");

      pg.innerHTML="<h2 style='font-size:20px;font-weight:700;margin-bottom:12px;'>Analytics</h2>"
        +navHtml
        +"<p style='color:#475569;font-size:13px;margin-bottom:16px;'>Product usage by technician. Tap a name to see their top products.</p>"

  } catch(e) {
    pg.innerHTML="<h2 style='font-size:20px;font-weight:700;margin-bottom:16px;'>Analytics</h2>"

async function generateQARAPdf(data){
  try {
    if(typeof PDFLib === "undefined") return null;
    var doc = await PDFLib.PDFDocument.create();
    var font = await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    var boldFont = await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    var margin = 50;
    var pageW = 612;
    var pageH = 792;

    var pages = [doc.addPage([pageW, pageH])];
    var y = pageH - 50;

    function curPage(){ return pages[pages.length-1]; }
    function checkY(needed){
      if(y < needed){ pages.push(doc.addPage([pageW,pageH])); y=pageH-50; }
    }
    function drawText(text, x, yPos, size, bold, color){
      curPage().drawText(String(text||"").substring(0,90), {
        x:x, y:yPos, size:size||10,
        font: bold?boldFont:font,
        color: color||PDFLib.rgb(0,0,0)
      });
    }
    function drawLine(yPos, color){
      curPage().drawLine({start:{x:margin,y:yPos},end:{x:pageW-margin,y:yPos},thickness:0.5,color:color||PDFLib.rgb(0.8,0.8,0.8)});
    }
    function drawRect(x,yPos,w,h,color){
      curPage().drawRectangle({x,y:yPos,width:w,height:h,color,borderWidth:0});
    }

    var isQA = data.isQA;
    var fd = {};
    try {
      var fKey = isQA ? "qaForms" : "raForms";
      var forms = await fbGet(fKey);
      if(forms && forms.length){
        var match = forms.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); })
          .find(function(f){ return f.techName===data.techName; });
        if(match && match.formData) fd = JSON.parse(match.formData);
      }
    } catch(e){ console.warn("PDF form data:", e.message); }

    // ── Header ──
    drawRect(margin, y-5, pageW-margin*2, 30, PDFLib.rgb(0.06,0.13,0.25));
    drawText("FOX PEST CONTROL — WILLAMETTE VALLEY", margin+8, y+4, 13, true, PDFLib.rgb(0.96,0.62,0.04));
    y -= 35;
    drawText(isQA ? "QUALITY ASSURANCE EVALUATION" : "RIDE ALONG EVALUATION", margin, y, 12, true);
    y -= 25; drawLine(y); y -= 15;

    // ── Info block ──
    drawText("Technician: "+(fd.tech||data.techName||""), margin, y, 11, true); y-=16;
    drawText("Date: "+(fd.date||""), margin, y, 11); y-=16;
    drawText("Manager: "+(fd.manager||data.createdBy||""), margin, y, 11); y-=16;
    if(fd.timein||fd.timeout) { drawText("Time: "+(fd.timein||"")+" — "+(fd.timeout||""), margin, y, 11); y-=16; }
    y -= 8; drawLine(y); y -= 15;

    function drawSection(title, color){
      checkY(40);
      drawRect(margin, y-3, pageW-margin*2, 18, PDFLib.rgb(0.06,0.13,0.25));
      drawText(title, margin+6, y+1, 10, true, PDFLib.rgb(0.96,0.62,0.04));
      y -= 22;
    }

    function drawItem(label, field){
      checkY(20);
      var val = fd[field]||"";
      var col = val==="exceeds"?PDFLib.rgb(0.13,0.69,0.3):val==="meets"?PDFLib.rgb(0.15,0.47,0.92):val==="below"?PDFLib.rgb(0.87,0.15,0.15):PDFLib.rgb(0.5,0.5,0.5);
      drawText(label, margin+4, y, 9, false, PDFLib.rgb(0.1,0.1,0.1));
      drawText(val?val.toUpperCase():"—", pageW-margin-60, y, 9, true, col);
      y -= 14;
    }

    function drawComment(label, val){
      if(!val) return;
      checkY(25);
      drawText(label+": "+val, margin+4, y, 9, false, PDFLib.rgb(0.3,0.3,0.3));
      y -= 14;
    }

    if(isQA){
      // QA Form sections
      drawSection("CUSTOMER INTERVIEW");
      drawItem("Were you home when tech arrived?","D9");
      drawItem("Did you know the tech's name?","D10");
      drawItem("Did tech arrive on time?","D11");
      drawItem("Did tech ask about your pest concerns?","D12");
      drawItem("Did tech discuss service expectations?","D13");
      drawComment("Comments", fd.comments1);
      y -= 6;

      drawSection("QUALITY SERVICE");
      drawItem("Asked questions / listened / took notes","D16");
      drawItem("Thorough investigation","D17");
      drawItem("Pest activity addressed","D18");
      drawItem("Used websters / removed wasp nests","D19");
      drawItem("Checked rodent / bait stations","D20");
      drawItem("Liquid application","D21");
      drawItem("Granular application","D22");
      drawComment("Comments", fd.comments2);
      y -= 6;

      drawSection("SERVICE WRAP UP");
      drawItem("Reported back to customer","D26");
      drawItem("Left service note","D27");
      drawItem("Start / end times correct","D28");
      drawItem("Discussed additional services","D29");
      drawItem("Work order signed","D30");
      drawItem("Photos added","D31");
      drawItem("Yard sign / stickers placed","D32");
      drawComment("Comments", fd.comments3);
      y -= 6;

      drawSection("REQUIRED DOCUMENTATION");
      drawItem("Proper pesticide application","D35");
      drawItem("Product usage recorded correctly","D36");
      drawComment("Comments", fd.comments4);
      y -= 10;

      if(fd.total !== undefined){
        checkY(30);
        var scoreColor = fd.total>=80?PDFLib.rgb(0.13,0.69,0.3):fd.total>=60?PDFLib.rgb(0.96,0.62,0.04):PDFLib.rgb(0.87,0.15,0.15);
        drawRect(margin, y-5, pageW-margin*2, 25, PDFLib.rgb(0.94,0.94,0.94));
        drawText("TOTAL SCORE: "+fd.total+"/100", margin+8, y+5, 13, true, scoreColor);
        y -= 35;
      }
    } else {
      // RA Form sections
      drawSection("PROFESSIONALISM");
      drawItem("Uniform clean / well groomed","R9");
      drawItem("Truck clean and organized","R10");
      drawItem("Properly equipped and supplied","R11");
      drawItem("Greeted customer warmly","R12");
      drawComment("Comments", fd.comments1);
      y -= 6;

      drawSection("QUALITY SERVICE");
      drawItem("Was expected / arrived on time","R15");
      drawItem("Asked questions / listened / took notes","R16");
      drawItem("Completed thorough investigation","R17");
      drawItem("Showed value / WOW'd the customer","R18");
      drawItem("Focused on seasonal targets","R19");
      drawItem("Demonstrated knowledge and skill","R20");
      drawComment("Comments", fd.comments2);
      y -= 6;

      drawSection("SERVICE WRAP UP");
      drawItem("Reported back to customer","R23");
      drawItem("Explained inspection details","R24");
      drawItem("Entered details into iPad","R25");
      drawItem("Discussed additional services","R26");
      drawComment("Comments", fd.comments3);
      y -= 6;

      drawSection("REQUIRED DOCUMENTATION");
      drawItem("Equipment","R29");
      drawItem("Product Safety / Handling / Usage","R30");
      drawItem("Inspections — Interior / Exterior","R31");
      y -= 10;
    }

    // ── Signatures ──
    checkY(120);
    y -= 10; drawLine(y); y -= 20;
    drawText("SIGNATURES", margin, y, 11, true); y -= 20;

    drawText("Manager: "+(data.createdBy||""), margin, y, 10, true); y -= 15;
    if(data.managerSig){
      try {
        var mgd = data.managerSig.replace(/^data:image\/\w+;base64,/,"");
        var mgImg = await doc.embedPng(Uint8Array.from(atob(mgd),function(c){return c.charCodeAt(0);}));
        curPage().drawImage(mgImg, {x:margin, y:y-45, width:160, height:45});
      } catch(e){}
    }
    drawText("Date: "+new Date().toLocaleDateString(), margin+170, y-25, 10);
    y -= 60; drawLine(y, PDFLib.rgb(0.7,0.7,0.7)); y -= 20;

    drawText("Technician: "+(data.techName||""), margin, y, 10, true); y -= 15;
    if(data.techSig){
      try {
        var tsd = data.techSig.replace(/^data:image\/\w+;base64,/,"");
        var tsImg = await doc.embedPng(Uint8Array.from(atob(tsd),function(c){return c.charCodeAt(0);}));
        curPage().drawImage(tsImg, {x:margin, y:y-45, width:160, height:45});
      } catch(e){}
    }
    drawText("Date: "+new Date().toLocaleDateString(), margin+170, y-25, 10);
    y -= 60;

    var pdfBytes = await doc.save();
    return btoa(String.fromCharCode.apply(null, new Uint8Array(pdfBytes)));
  } catch(e){
    console.warn("generateQARAPdf:", e.message);
    return null;
  }
}

async function renderSign(skipReload){
  const pg = document.getElementById("pg-sign");
  if(!pg) return;
  // Load fresh sign requests from sheet unless we just updated locally
  if(!skipReload){
    try {
      var signData = await gs("getSignRequestsServer", null);
      var rawReqs = signData && (signData.signRequests || signData.requests || []);
      if(rawReqs && rawReqs.length >= 0){
        // Parse any JSON string fields
        rawReqs.forEach(function(sr){
          if(typeof sr.qaData==="string") try{sr.qaData=JSON.parse(sr.qaData);}catch(e){sr.qaData=null;}
          if(typeof sr.raData==="string") try{sr.raData=JSON.parse(sr.raData);}catch(e){sr.raData=null;}
        });
        // Merge - preserve any local "Signed" status
        var sheetReqs = rawReqs;
        sheetReqs.forEach(function(sr){
          var local = S.signRequests.find(function(r){ return r.id===sr.id; });
          if(local && local.status==="Signed" && sr.status!=="Signed"){
            sr.status = "Signed"; // keep local signed status
            sr.signedFileId = local.signedFileId;
            sr.qaData = local.qaData;
            sr.raData = local.raData;
          }
        });
        S.signRequests = sheetReqs;
        lsSet("hub:signRequests", S.signRequests);
      }
    } catch(e){ console.warn("Load sign requests:", e); }
  }
  if(S.role==="manager") renderSignManager(pg);
  else renderSignTech(pg);
}

function renderSignManager(pg){
  const view = S._signView||"list";
  if(view==="upload") { renderSignUpload(pg); return; }
  if(view==="qa") { renderQAForm(pg); return; }
  if(view==="ra") { renderRAForm(pg); return; }
  if(view==="signing") { renderSignCanvas(pg,"manager"); return; }

  // List view
  const reqs = S.signRequests;
  const pending = reqs.filter(function(r){ return r.status==="Pending"; });
  const signed = reqs.filter(function(r){ return r.status==="Signed"; });

  pg.innerHTML = "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;'>"
    +"<h2 style='font-size:20px;font-weight:700;'>Documents</h2>"
    +"<div style='display:flex;gap:8px;'>"
    +"<button class='btn bg' style='font-size:13px;padding:8px 14px;' data-a='sign-qa'>&#x1F4CB; QA Form</button>"
    +"<button class='btn bg' style='font-size:13px;padding:8px 14px;' data-a='sign-ra'>&#x1F697; RA Form</button>"
    +"<button class='btn bp' style='font-size:13px;padding:8px 14px;' data-a='sign-upload'>+ Upload Doc</button>"
    +"</div></div>"
    +(pending.length>0
      ? "<div style='font-size:12px;font-weight:600;color:#f59e0b;text-transform:uppercase;margin-bottom:8px;'>Awaiting Signature</div>"
        +pending.map(function(r){ return signCard(r); }).join("")
      : "")
    +(signed.length>0
      ? "<div style='font-size:12px;font-weight:600;color:#22c55e;text-transform:uppercase;margin-bottom:8px;margin-top:12px;'>Signed</div>"
        +signed.map(function(r){ return signCard(r); }).join("")
      : "")
    +(reqs.length===0
      ? "<div class='card' style='padding:30px;text-align:center;color:#475569;'><div style='font-size:36px;margin-bottom:12px;'>&#x1F4DD;</div><p>No documents yet.</p><p style='font-size:13px;margin-top:6px;'>Tap Send for Signature to upload a document.</p></div>"
      : "");
}

function signCard(r){
  var sc = r.status==="Signed"?"#22c55e":"#f59e0b";
