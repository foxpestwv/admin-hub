<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a1628;color:#e2e8f0;font-family:'Segoe UI',sans-serif;min-height:100vh;font-size:15px;}
input,textarea,select,button{font-family:inherit;}
.btn{cursor:pointer;border:none;border-radius:8px;font-weight:600;transition:all .15s;padding:10px 18px;font-size:14px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.97);}
.bp{background:#2563eb;color:#fff;} .bp:hover{background:#1d4ed8;}
.bg{background:transparent;color:#94a3b8;border:1px solid #1e3a5f;} .bg:hover{border-color:#3b82f6;color:#e2e8f0;}
.bs{background:#16a34a;color:#fff;} .bs:hover{background:#15803d;}
.bd{background:#dc2626;color:#fff;padding:6px 12px;font-size:12px;} .bd:hover{background:#b91c1c;}
.card{background:#0f1f38;border-radius:12px;border:1px solid #1e3a5f;padding:16px;}
.inp{background:#0a1628;color:#e2e8f0;border:1px solid #1e3a5f;border-radius:8px;padding:9px 12px;font-size:14px;width:100%;outline:none;}
.inp:focus{border-color:#3b82f6;}
#hdr{background:#0a1628;border-bottom:1px solid #1e3a5f;padding:0 16px;position:sticky;top:0;z-index:50;}
#hdr-in{max-width:760px;margin:0 auto;display:flex;align-items:center;height:52px;gap:8px;overflow:hidden;}
#nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:1;min-width:0;} #nav::-webkit-scrollbar{display:none;}
.nb{display:flex;align-items:center;gap:4px;padding:6px 9px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#64748b;touch-action:manipulation;}
.nb.on{background:#1e3a5f;color:#93c5fd;}
.bdg{background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;margin-left:2px;}
#wrap{max-width:760px;margin:0 auto;padding:20px 14px;}
.pg{display:none;} .pg.on{display:block;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.sc{background:#0f1f38;border-radius:12px;border:1px solid #1e3a5f;padding:16px;}
.al-o{background:#431407;border:1px solid #c2410c;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;cursor:pointer;}
.al-a{background:#1c1100;border:1px solid #92400e;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;gap:8px;align-items:center;cursor:pointer;}
.sbdg{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;}
.pb{height:3px;background:#0f1f38;border-radius:2px;margin-bottom:16px;}
.pf{height:100%;background:#2563eb;border-radius:2px;transition:width .3s;}
.skb{width:34px;height:34px;border-radius:7px;border:1px solid #1e3a5f;cursor:pointer;font-weight:700;font-size:13px;background:#0a1628;color:#64748b;}
.skb.on{color:#fff;}
.fb{padding:5px 12px;border-radius:7px;border:1px solid #1e3a5f;cursor:pointer;font-size:12px;font-weight:600;background:transparent;color:#64748b;}
.fb.on{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd;}
.stb{padding:6px 12px;border-radius:7px;border:1px solid #1e3a5f;cursor:pointer;font-size:13px;font-weight:500;background:transparent;color:#64748b;}
.stb.on{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd;}
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
.pd{width:14px;height:14px;border-radius:50%;background:#1e3a5f;transition:background .15s;display:inline-block;}
.pd.on{background:#3b82f6;}
.pk{background:#162235;color:#e2e8f0;border:1px solid #1e3a5f;border-radius:10px;padding:20px 0;font-size:24px;font-weight:600;cursor:pointer;width:100%;text-align:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;min-height:64px;display:flex;align-items:center;justify-content:center;}
.pk:active{background:#1e3a5f;}
.pk.del{background:#1e293b;color:#94a3b8;font-size:16px;}
.tag-low{padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;background:#431407;color:#fb923c;}
@media print{
  body{background:#fff;color:#000;}
  #hdr,#login,#app>div:not(#wrap){display:none!important;}
  #wrap{padding:0;max-width:100%;}
  .pg{display:none!important;}
  #print-area{display:block!important;}
  .no-print{display:none!important;}
  .print-card{border:1px solid #ccc;border-radius:4px;padding:10px;margin-bottom:10px;break-inside:avoid;}
  .print-header{border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:16px;}
}

<body>

<div id="login">
  <div id="logo-login" style="height:80px;width:200px;margin-bottom:32px;"></div>
  <div style="background:#0f1f38;border-radius:16px;padding:32px;width:100%;max-width:340px;border:1px solid #1e3a5f;">
    <h2 style="text-align:center;font-size:18px;font-weight:600;margin-bottom:8px;">Admin Hub</h2>
    <p style="text-align:center;color:#64748b;font-size:13px;margin-bottom:20px;">Fox Pest Control - Willamette Valley</p>

    <!-- Step 1: Email -->
    <div id="login-step-email">
      <label style="display:block;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;">Your Email</label>
      <input type="email" id="login-email" class="inp" placeholder="yourname@fox-marketingservices.com" style="margin-bottom:12px;">
      <div id="email-err" style="text-align:center;color:#ef4444;font-size:13px;margin-bottom:12px;min-height:20px;"></div>
      <button class="btn bp" id="email-next-btn" style="width:100%;padding:12px;font-size:15px;">Continue</button>
    </div>

    <!-- Step 2: Role Selection -->
    <div id="login-step-role" style="display:none;">
      <div id="login-role-email" style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px;"></div>
      <p style="text-align:center;color:#e2e8f0;font-size:15px;font-weight:600;margin-bottom:16px;">How are you logging in today?</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn bp" id="role-admin-btn" style="padding:16px;font-size:15px;border-radius:10px;">Administrator</button>
        <button class="btn bg" id="role-tech-btn" style="padding:16px;font-size:15px;border-radius:10px;">Technician</button>
      </div>
      <button style="background:transparent;border:none;color:#64748b;font-size:12px;cursor:pointer;margin-top:16px;width:100%;text-align:center;" id="back-from-role-btn">Use a different email</button>
    </div>

    <!-- Step 3: PIN -->
    <div id="login-step-pin" style="display:none;">
      <div id="login-email-display" style="text-align:center;color:#94a3b8;font-size:13px;margin-bottom:4px;"></div>

// Firebase SDK loaded via script tags in <head>
var _fbApp, _db, _auth, _fbReady = false;

function initFirebase(){
  if(_fbReady) return Promise.resolve();
  return new Promise(function(resolve, reject){
    var check = setInterval(function(){
      if(typeof firebase !== "undefined" && firebase.firestore){
        clearInterval(check);
        if(!_fbApp){
          _fbApp = firebase.initializeApp(firebaseConfig);
          _db = firebase.firestore();
          _auth = firebase.auth();
        }
        // Sign in anonymously so Firestore rules pass
        if(!_auth.currentUser){
          _auth.signInAnonymously().then(function(){
            _fbReady = true;
            resolve();
          }).catch(function(e){
            console.warn("Anonymous auth failed:", e.message);
            // Still try to proceed
            _fbReady = true;
            resolve();
          });
        } else {
          _fbReady = true;
          resolve();
        }
      }
    }, 50);
    setTimeout(function(){ clearInterval(check); reject(new Error("Firebase SDK timeout")); }, 10000);
  });
}

// ─── Auto Update Check ───────────────────────────────────────────────────────
async function checkForUpdates(silent){
  try {
    // Check localStorage FIRST before any network call
    var dismissedVersion = "";
    try { dismissedVersion = localStorage.getItem("hub:dismissedVersion")||""; } catch(e){}

    await initFirebase();
    if(!_auth.currentUser){ await _auth.signInAnonymously(); }
    var vdoc = await _db.collection("config").doc("appVersion").get();
    if(!vdoc.exists){ return; }
    var latestVersion = vdoc.data().version;
    var latestNote = vdoc.data().note||"";
    if(!latestVersion) return;
    window._latestVersion = latestVersion;

    // Don't show banner if: versions match, already dismissed, or app IS latest
    if(APP_VERSION === latestVersion) return;
    if(dismissedVersion === latestVersion) return;

    if(latestVersion !== APP_VERSION){
      var existing = document.getElementById("update-banner");
      if(existing) existing.remove();
      var banner = document.createElement("div");
      banner.id = "update-banner";
      banner.style.cssText = "position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#000;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:9999;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.3);";
      var msg = document.createElement("span");
      msg.textContent = "Update available" + (latestNote ? " — " + latestNote : "");
      var btn = document.createElement("button");
      btn.textContent = "Update Now";
      btn.style.cssText = "background:#000;color:#f59e0b;border:none;padding:6px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;";
      btn.onclick = function(){ window.location.href = window.location.pathname + "?v=" + Date.now(); };
      banner.appendChild(msg);
      banner.appendChild(btn);
      document.body.prepend(banner);
    } else {
      try { localStorage.removeItem("hub:dismissedVersion"); } catch(e){}
      if(!silent) showToast("App is up to date ✓");
    }
  } catch(e){ console.warn("Update check failed:", e.message); }
}

function showToast(msg){
  var t = document.createElement("div");
  t.style.cssText = "position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e3a5f;color:#e2e8f0;padding:10px 20px;border-radius:20px;font-size:13px;z-index:9999;border:1px solid #2563eb;white-space:nowrap;";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 3000);
}

function updateApp(){
  // Store dismissed version synchronously BEFORE redirect
  try { localStorage.setItem("hub:dismissedVersion", window._latestVersion||APP_VERSION); } catch(e){}
  var base = window.location.pathname;
  window.location.href = base + "?v=" + Date.now();
}


// ─── Firebase Data Layer ──────────────────────────────────────────────────────
// Replaces all gs() calls with direct Firestore operations

async function fbGet(collection, docId){
  await initFirebase();
  if(docId){
    var snap = await _db.collection(collection).doc(docId).get();
    return snap.exists ? snap.data() : null;
  } else {
    var snap3 = await _db.collection(collection).get();
    var seen = {};
    var docs = [];
    snap3.docs.forEach(function(d){
      if(!seen[d.id]){
        seen[d.id] = true;
        docs.push(Object.assign({_id:d.id}, d.data()));
      }
    });
    return docs;
  }
}

async function fbSet(collection, docId, data){
  await initFirebase();
  await _db.collection(collection).doc(docId).set(data, {merge:true});
  return {ok:true};
}

async function fbAdd(collection, data){
  await initFirebase();
  var ref = await _db.collection(collection).add(data);
  return {ok:true, id:ref.id};
}

async function fbUpdate(collection, docId, data){
  await initFirebase();
  await _db.collection(collection).doc(docId).update(data);
  return {ok:true};
}

async function fbDelete(collection, docId){
  await initFirebase();
  await _db.collection(collection).doc(docId).delete();
  return {ok:true};
}

async function fbQuery(collection, field, op, value){
  await initFirebase();
  var snap = await _db.collection(collection).where(field, op, value).get();
  return snap.docs.map(function(d){ return Object.assign({_id:d.id},d.data()); });
}

// ─── gs() compatibility shim ─────────────────────────────────────────────────
// Maps old gs() calls to Firebase equivalents
async function gs(fn, data){
  var action = fn.replace("Server","");
  try {
    switch(action){

      // ── ACCOUNTS ────────────────────────────────────────────────────────────
      case "getAccounts": {
        var cfg = await fbGet("config","accounts");
        return cfg || {managers:[],techAccounts:[],trucks:[],cats:[],inspFields:[]};
      }
      case "saveAccounts":
      case "saveAccountsServer": {
        await fbSet("config","accounts",{
          managers: data.managers||[],
          techAccounts: data.techAccounts||[],
          trucks: data.trucks||[],
          cats: data.cats||[],
          inspFields: data.inspFields||[],
          updatedAt: new Date().toISOString()
        });
        lsSet("hub:managers", data.managers||[]);
        lsSet("hub:techAccounts", data.techAccounts||[]);
        lsSet("hub:trucks", data.trucks||[]);
        lsSet("hub:cats", data.cats||[]);
        lsSet("hub:inspFields", data.inspFields||[]);
        return {ok:true};
      }

      // ── PRODUCTS ────────────────────────────────────────────────────────────
      case "getProducts": {
        var prods = await fbGet("products");
        var parsedProds = (prods||[]).map(function(p){
          return {
            id: p.id||p._id||"",
            name: p.name||"",
            unit: p.unit||"each",
            qty: Number(p.qty)||0,
            lowAt: Number(p.lowAt)||0,
            reorderNote: p.reorderNote||"",
            truckWarnAbove: Number(p.truckWarnAbove)||0,
            createdAt: p.createdAt||"",
            upc: p.upc||"",
            sdsUrl: p.sdsUrl||"",
            labelUrl: p.labelUrl||""
          };
        });
        return {products: parsedProds};
      }
      case "updateQty": {
        await fbUpdate("products", data.id, {qty: data.qty, updatedAt: new Date().toISOString()});
        return {ok:true};
      }
      case "updateProductUpc": {
        await fbUpdate("products", data.id, {upc: data.upc, updatedAt: new Date().toISOString()});
        return {ok:true};
      }
      case "updateProductField": {
        var fieldUpdate = {updatedAt: new Date().toISOString()};
        fieldUpdate[data.field] = data.value;
        await fbUpdate("products", data.id, fieldUpdate);
        return {ok:true};
      }
      case "updateLowAt": {
        await fbUpdate("products", data.id, {lowAt: data.lowAt});
        return {ok:true};
      }
      case "updateTruckWarnAbove": {
        await fbUpdate("products", data.id, {truckWarnAbove: data.truckWarnAbove});
        return {ok:true};
      }
      case "addProductToSheet": {
        var newProd = {
          id: "prod_"+Date.now(),
          name: data.name, unit: data.unit||"each",
          qty: 0, lowAt: data.lowAt||0,
          truckWarnAbove: data.truckWarnAbove||0,
          reorderNote: data.reorderNote||"",
          createdAt: new Date().toISOString()
        };
        await fbSet("products", newProd.id, newProd);
        return {ok:true, product: newProd};
      }
      case "removeProductFromSheet": {
        await fbDelete("products", data.id);
        return {ok:true};
      }

      // ── ADJUSTMENT LOG ───────────────────────────────────────────────────────
      case "logAdjustment": {
        var adjId = "adj_"+Date.now();
        await fbSet("adjustmentLog", adjId, {
          id: adjId,
          date: new Date().toISOString(),
          productId: data.productId,
          productName: data.productName,

          reason: data.reason||"",

        });

        return {ok:true};
      }
      case "logAdjustment": {
        var adjId = data.id||"adj_"+Date.now();
        await fbSet("adjustmentLog", adjId, Object.assign({}, data, {id:adjId}));
        // Update cache
        if(S._cachedAdjLog){
          S._cachedAdjLog.unshift([data.date,data.product,data.unit,data.qtyBefore,data.qtyAfter,data.change,data.tech,data.reason]);

      }
      case "getAdjustmentLog": {

        var logSnap = await _db.collection("adjustmentLog").get();
        var logDocs = logSnap.docs.map(function(d){ return d.data(); });
        // Sort by date descending in memory
        logDocs.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
        if(logDocs.length > 500) logDocs = logDocs.slice(0,500);
        // Convert Firebase doc format to array format analytics expects
        // [date, product, unit, qty_before, qty_after, change, tech, reason]
        var logRows = logDocs.map(function(doc){

            doc.date||"",

      // ── ORDERS ───────────────────────────────────────────────────────────────
      case "getPending": {
        var pend = await fbGet("pendingOrders");

        if(Array.isArray(orderDoc.items)) orderDoc.items = JSON.stringify(orderDoc.items);
        await fbSet("pendingOrders", poId, orderDoc);
        return {ok:true, id:poId};
      }
      case "writeToOrderSheet":
      case "writeToOrderSheetServer": {
        // Call Apps Script to write quantities to order spreadsheet
        var bridgeResp = await fetch(EMAIL_BRIDGE, {
          method:"POST", headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({action:"writeToOrderSheet", items:data.items||data})
        }).then(function(r){ return r.json(); }).catch(function(e){ return {ok:false,error:e.message}; });
        return bridgeResp;
      }
      case "updateRestockOrder": {
        if(data.id) await fbUpdate("restockOrders", data.id, {status:data.status||"Cancelled"});
        return {ok:true};
      }
      case "addOrderHistory": {
        var ohId2 = "oh_"+Date.now();
        await fbSet("orderHistory", ohId2, Object.assign({}, data, {id:ohId2, date:new Date().toISOString()}));
        return {ok:true, id:ohId2};
      }
      case "getOrderHistory": {
        await initFirebase();
        var ohSnap = await _db.collection("orderHistory").get();
        var ohDocs = ohSnap.docs.map(function(d){ return d.data(); });
        ohDocs.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
        // Convert to array format analytics expects: [date, orderId, tech, product, qty, unit]
        var ohRows = [];
        ohDocs.forEach(function(doc){
          var items = doc.items;
          if(typeof items==="string") try{ items=JSON.parse(items); }catch(e){ items=[]; }
          (items||[]).forEach(function(item){
            ohRows.push([
              doc.date||"",
              doc.id||"",
              doc.tech||doc.requestedBy||"",
              item.name||item.product||"",
              item.qty||item.approvedQty||0,
              item.unit||""
            ]);
          });
        });
        return {orders: ohRows};
      }
      case "updateOrderStatus": {
        var col2 = data.collection||"pendingOrders";
        var updateData2 = {status:data.status, updatedAt:new Date().toISOString(), approvedBy:data.approvedBy||""};
        if(data.approvedQty!==undefined) updateData2.approvedQty = data.approvedQty;
        if(data.items) updateData2.items = data.items;
        await fbUpdate(col2, data.id, updateData2);
        // Delete from pendingOrders after approval/denial
        if(col2==="pendingOrders" && (data.status==="Approved"||data.status==="Denied")){
          try { await fbDelete("pendingOrders", data.id); } catch(e){}
        }
        return {ok:true};
      }

      // ── RESTOCK ORDERS ────────────────────────────────────────────────────────
      case "saveRestockOrder": {
        var rid = data.id || "ro_"+Date.now();
        await fbSet("restockOrders", rid, Object.assign({}, data, {id:rid, updatedAt:new Date().toISOString()}));
        return {ok:true, id:rid};
      }
      case "getRestockOrders": {
        await initFirebase();
        var roSnap = await _db.collection("restockOrders").orderBy("date","desc").get();
        var roData = roSnap.docs.map(function(d){
          var rec = d.data();
          if(typeof rec.items === "string") try{ rec.items = JSON.parse(rec.items); }catch(e){ rec.items=[]; }
          if(typeof rec.receivedItems === "string") try{ rec.receivedItems = JSON.parse(rec.receivedItems); }catch(e){ rec.receivedItems={}; }
          return rec;
        });
        return {orders: roData};
      }
      case "updateRestockOrder": {
        await fbUpdate("restockOrders", data.id, Object.assign({}, data, {updatedAt:new Date().toISOString()}));
        return {ok:true};
      }

      // ── TECHS ─────────────────────────────────────────────────────────────────
      case "getTechs": {
        var cfg2 = await fbGet("config","accounts");
        var techs2 = (cfg2&&cfg2.techAccounts)||[];
        return {techs: techs2.map(function(t){ return {name:t.name, email:t.email||"", truck:t.truck||""}; })};
      }
      case "addTechToSheet": {
        var cfg3 = await fbGet("config","accounts") || {};
        var accts = cfg3.techAccounts||[];
        accts.push({id:"tech_"+Date.now(), name:data.name, email:data.email||"", truck:data.truck||"", pin:"", tempPin:"1234", isTemp:true});
        await fbSet("config","accounts", Object.assign(cfg3, {techAccounts:accts}));
        return {ok:true};
      }

      // ── INSPECTIONS ───────────────────────────────────────────────────────────
      case "logInspection": {
        var inspId = "insp_"+Date.now();
        await fbSet("inspections", inspId, Object.assign({}, data, {id:inspId, date:new Date().toISOString()}));
        return {ok:true, id:inspId};
      }
      case "getInspections": {
        await initFirebase();
        var inspSnap = await _db.collection("inspections").orderBy("date","desc").limit(200).get();
        var inspData = inspSnap.docs.map(function(d){
          var rec = d.data();
          if(typeof rec.scores === "string") try{ rec.scores = JSON.parse(rec.scores); }catch(e){ rec.scores={}; }
          if(typeof rec.comments === "string") try{ rec.comments = JSON.parse(rec.comments); }catch(e){ rec.comments={}; }
          return rec;
        });
        return {inspections: inspData};
      }
      case "saveInspectionPdf": {
        // Store PDF record in Firebase, keep Drive for actual file
        var pdfId = "pdf_"+Date.now();
        await fbSet("inspectionPdfs", pdfId, {
          id: pdfId,
          date: new Date().toISOString(),
          truck: data.truck||"",
          fileName: data.fileName||"",
          html: data.html||""
        });
        return {ok:true, id:pdfId};
      }

      // ── TRUCK INVENTORY ────────────────────────────────────────────────────────
      case "logTruckInventory": {
        var tiId = "ti_"+data.techName.replace(/\s/g,"_")+"_"+Date.now();
        await fbSet("truckInventory", tiId, Object.assign({}, data, {id:tiId, date:new Date().toISOString()}));
        return {ok:true};
      }
      case "getTruckInventory": {
        await initFirebase();
        var tiSnap = await _db.collection("truckInventory").orderBy("date","desc").get();
        var byTech = {};
        tiSnap.docs.forEach(function(d){
          var rec = d.data();
          if(typeof rec.products === "string") try{ rec.products = JSON.parse(rec.products); }catch(e){ rec.products=[]; }
          if(!byTech[rec.techName]) byTech[rec.techName] = rec;
        });
        return {trucks: byTech};
      }

      // ── SIGN REQUESTS ─────────────────────────────────────────────────────────
      case "getAccountsServer":
      case "getAccounts": {
        await initFirebase();
        var acctDoc = await _db.collection("config").doc("accounts").get();
        if(acctDoc.exists) return acctDoc.data();
        return {managers:[], techAccounts:[], trucks:[], cats:[], inspFields:[]};
      }
      case "getSignRequests": {
        await initFirebase();
        var srSnap = await _db.collection("signRequests").get();
        var srDocs = srSnap.docs.map(function(d){ return Object.assign({_id:d.id},d.data()); });
        srDocs.sort(function(a,b){ return (b.createdAt||b.date||"").localeCompare(a.createdAt||a.date||""); });
        return {signRequests: srDocs};
      }
      case "uploadSignRequest": {
        var srId = data.id || "sr_"+Date.now();
        // Store managerSig separately to avoid Firestore 1MB limit
        var managerSig = data.managerSig||"";
        var dataToStore = Object.assign({}, data, {id:srId, status:"Pending", createdAt:new Date().toISOString()});
        // Truncate managerSig in main doc to save space, store full version in separate doc
        if(managerSig && managerSig.length > 50000){
          dataToStore.managerSig = managerSig.substring(0,100)+"...STORED_SEPARATELY";
          await fbSet("signatureSigs", srId+"_mgr", {sig:managerSig, srId:srId});
        }
        await fbSet("signRequests", srId, dataToStore);
        // Send email to tech
        if(data.techEmail){
          sendEmail(data.techEmail,
            "[Fox Pest Control] Document Ready for Signature: "+data.docName,
            "Hi "+data.techName+",\n\n"+data.createdBy+" has sent you a document to sign.\n\nDocument: "+data.docName+"\n\nPlease log into the Fox Pest Control Admin Hub to review and sign.\n\nhttps://foxpestwv.github.io/admin-hub\n\nFox Pest Control - Willamette Valley"
          );
        }
        return {ok:true, id:srId};
      }
      case "uploadMultiSignRequest": {
        var msId = data.id || "ms_"+Date.now();
        // Store PDF in base64 in Firestore (for small PDFs) or just metadata
        var signers = data.signers||[];
        // Save one record per signer
        for(var si=0; si<signers.length; si++){
          var s = signers[si];
          var rowId = msId+"-"+(si+1);
          await fbSet("signRequests", rowId, {
            id: rowId,
            multiSignId: msId,
            date: new Date().toISOString(),
            techName: s.name,
            techEmail: s.email||"",
            docName: data.docName,
            status: "Pending",
            createdBy: data.createdBy,
            note: data.note||"",
            pdfBase64: data.pdfBase64||"",
            fields: s.fields||[],
            signerOrder: si,
            totalSigners: signers.length,
            isMultiSign: true,
            formType: "MULTI:"+msId
          });
          if(s.email){
            sendEmail(s.email,
              "[Fox Pest Control] Please Sign: "+data.docName,
              "Hi "+s.name+",\n\n"+data.createdBy+" has sent you a document that requires your signature.\n\nDocument: "+data.docName+"\n"+(data.note?"Note: "+data.note+"\n":"")+"Please log into the Fox Pest Control Admin Hub and go to the Sign tab.\n\nhttps://foxpestwv.github.io/admin-hub\n\nFox Pest Control - Willamette Valley"
            );
          }
        }
        return {ok:true, id:msId, fileId:msId};
      }
      case "getSigningPdf": {
        var srDoc = await fbGet("signRequests", data.id);
        if(!srDoc) return {ok:false, error:"Request not found"};
        return {ok:true, pdfBase64: srDoc.pdfBase64||"", fields: srDoc.fields||[]};
      }
      case "submitTechSignature": {
        // Just update Firebase status - the caller (signSubmitTech) handles Apps Script
        await fbUpdate("signRequests", data.id, {
          status: "Signed",
          signedDate: new Date().toISOString(),
          techSig: data.techSig||""
        });
        return {ok:true};
      }
      case "submitMultiSign": {
        // Update this signer's record
        await fbUpdate("signRequests", data.id, {
          status: "Signed",
          signedDate: new Date().toISOString(),
          signedPdfBase64: data.signedPdfBase64||"",
          techSig: data.techSig||""
        });
        // Update remaining unsigned signers with new PDF
        var multiId = data.multiSignId||"";
        if(multiId){
          var allSigners = await fbQuery("signRequests","multiSignId","==",multiId);
          var allSigned = allSigners.every(function(s){ return s.status==="Signed"; });
          // Update pending signers with latest signed PDF
          for(var ai=0; ai<allSigners.length; ai++){
            if(allSigners[ai].status!=="Signed"){
              await fbUpdate("signRequests", allSigners[ai].id, {pdfBase64: data.signedPdfBase64||""});
            }
          }
          if(allSigned){
            sendEmail(data.managerEmail||"john.kluttz@fox-marketingservices.com",
              "[Fox Pest Control] All Signatures Complete: "+data.docName,
              "All signers have completed signing "+data.docName+".\n\nSigners: "+allSigners.map(function(s){return s.techName;}).join(", ")+"\n\nFox Pest Control - Willamette Valley"
            );
          } else {
            var remaining = allSigners.filter(function(s){ return s.status!=="Signed"; }).map(function(s){ return s.techName; });
            sendEmail(data.managerEmail||"john.kluttz@fox-marketingservices.com",
              "[Fox Pest Control] Signature Received: "+data.docName,
              data.techName+" has signed "+data.docName+".\n\nStill waiting on: "+remaining.join(", ")+"\n\nFox Pest Control - Willamette Valley"
            );
          }
          return {ok:true, allSigned:allSigned};
        }
        return {ok:true};
      }
      case "deleteSignRequest": {
        await fbDelete("signRequests", data.id);
        return {ok:true};
      }

      // ── QA / RA FORMS ─────────────────────────────────────────────────────────
      case "writeQAData": {
        // Save to Firebase for record keeping
        var qaId2 = "qa_"+Date.now();
        await fbSet("qaForms", qaId2, {
          id: qaId2, type: "QA",
          date: new Date().toISOString(),
          manager: data.manager||"",
          formData: JSON.stringify(data.qaData||{}),
          status: "Pending",
          techName: (data.qaData||{}).tech||""
        });
        // Also write to Google Sheet via Apps Script for PDF generation
        var qaResp = await fetch(EMAIL_BRIDGE, {
          method:"POST", headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({action:"writeQAData", qaData:data.qaData, manager:data.manager, managerSig:data.managerSig||"", techEmail:data.techEmail||""})
        }).then(function(r){ return r.json(); }).catch(function(e){ return {ok:false,error:e.message}; });
        return qaResp.ok ? {ok:true, id:qaId2} : qaResp;
      }
      case "writeRAData": {
        // Save to Firebase for record keeping
        var raId2 = "ra_"+Date.now();
        await fbSet("raForms", raId2, {
          id: raId2, type: "RA",
          date: new Date().toISOString(),
          manager: data.manager||"",
          formData: JSON.stringify(data.raData||{}),
          status: "Pending",
          techName: (data.raData||{}).tech||""
        });
        // Also write to Google Sheet via Apps Script for PDF generation
        var raResp = await fetch(EMAIL_BRIDGE, {
          method:"POST", headers:{"Content-Type":"text/plain"},
          body: JSON.stringify({action:"writeRAData", raData:data.raData, manager:data.manager, managerSig:data.managerSig||"", techEmail:data.techEmail||""})
        }).then(function(r){ return r.json(); }).catch(function(e){ return {ok:false,error:e.message}; });
        return raResp.ok ? {ok:true, id:raId2} : raResp;
      }

      // ── EMAIL ─────────────────────────────────────────────────────────────────
      case "sendEmail": {
        return sendEmail(data.to, data.subject, data.body);
      }
      case "saveAppVersion": {
        await fbSet("config", "appVersion", {
          version: data.version||"1.0.0",
          note: data.note||"",
          updatedAt: new Date().toISOString()
        });
        return {ok:true};
      }

      default:
        console.warn("Unknown gs() action:", action);
        return {ok:false, error:"Unknown action: "+action};
    }
  } catch(e){
    console.error("Firebase gs() error ["+action+"]:", e.message);
    return {ok:false, error:e.message};
  }
}

function fbParseArray(val){
  if(Array.isArray(val)) return val;
  if(typeof val === "string" && val.trim().startsWith("[")) {
    try { return JSON.parse(val); } catch(e){ return []; }
  }
  return [];
}

async function loadAccountsFromSheet(){
  try {
    const result = await gs("getAccountsServer", null);
    if(result){
      var mgrs = fbParseArray(result.managers);
      if(mgrs.length){ S.managers = mgrs; lsSet("hub:managers", S.managers); }

      var techs = fbParseArray(result.techAccounts);
      if(techs.length){ S.techAccounts = techs; lsSet("hub:techAccounts", S.techAccounts); }

      var trucks = fbParseArray(result.trucks);
      if(trucks.length){ S.trucks = trucks; lsSet("hub:trucks", S.trucks); }

      var cats = fbParseArray(result.cats);
      if(cats.length){ S.cats = cats; lsSet("hub:cats", S.cats); }

      var inspFields = fbParseArray(result.inspFields);
      if(inspFields.length){ S.inspFields = inspFields; lsSet("hub:inspFields", S.inspFields); }
    }
    if(S.role && S.tab === "settings") renderSettings();
  } catch(e){ console.warn("Load accounts:", e.message); }
}

async function saveAccountsToSheet(){

    await gs("saveAccountsServer", {managers: S.managers, techAccounts: S.techAccounts, trucks: S.trucks, cats: S.cats, inspFields: S.inspFields});
  } catch(e){ console.warn("Save accounts:", e.message); }
}

async function syncFromSheet(){
  badge("syncing");
  try {
    const [pr,tc,ro,insp,ti] = await Promise.all([gs("getProductsServer",null),gs("getTechsServer",null),gs("getRestockOrdersServer",null),gs("getInspectionsServer",null),gs("getTruckInventoryServer",null)]);
    // Also load sign requests fresh
    try {
      var srResult = await gs("getSignRequestsServer", null);
      if(srResult && srResult.requests){
        S.signRequests = srResult.requests.map(function(r){
          return {
            id: r.id, date: r.date||r.createdAt||"",
            techName: r.techName||"", techEmail: r.techEmail||"",
            docName: r.docName||"", status: r.status||"Pending",
            createdBy: r.createdBy||"", note: r.note||"",
            isMultiSign: !!r.isMultiSign, multiSignId: r.multiSignId||"",
            isQA: !!(r.formType==="QA"), isRA: !!(r.formType==="RA"),
            fields: r.fields||[], _cachedFields: r.fields||[]
          };
        });
        lsSet("hub:signRequests", S.signRequests);
      }
    } catch(e){ console.warn("Sign requests sync:", e.message); }
    if(pr&&pr.products&&pr.products.length){
      // Preserve local truckWarnAbove values when syncing
      pr.products.forEach(function(p){
        var local = S.products.find(function(lp){ return lp.id===p.id||lp.name===p.name; });
        if(local && local.truckWarnAbove) p.truckWarnAbove = local.truckWarnAbove;
        // Use sheet value if it has one
        if(p.truckWarnAbove===undefined) p.truckWarnAbove = 0;
      });
      pr.products.sort(function(a,b){ return a.name.toLowerCase().localeCompare(b.name.toLowerCase()); });
      S.products=pr.products;lsSet("hub:products",pr.products);
    }
    if(tc&&tc.techs&&tc.techs.length){
      S.techs=tc.techs.map(t=>t.name);
      S.techEmails=tc.techs;
      lsSet("hub:techs",S.techs);
      lsSet("hub:techEmails",S.techEmails);
      // Merge sheet techs into techAccounts - add new ones, preserve PINs
      tc.techs.forEach(function(t){
        var existing = S.techAccounts.find(function(a){ return a.name===t.name; });
        if(!existing){
          S.techAccounts.push({
            id:"tech_"+Date.now()+"_"+Math.random().toString(36).slice(2,6),
            name:t.name, email:t.email,
            pin:"", tempPin:"0000", isTemp:true
          });
        } else {
          existing.email = t.email; // Update email in case it changed
        }
      });
      lsSet("hub:techAccounts",S.techAccounts);
    }
    if(ro&&ro.orders&&ro.orders.length){
      S.restockOrders=ro.orders;
      lsSet("hub:restockOrders",S.restockOrders);
    }
    if(insp&&insp.inspections&&insp.inspections.length){
      S.inspections=insp.inspections;
      lsSet("hub:inspections",S.inspections);
    }
    if(ti&&ti.trucks){
      S.sheetTruckData=ti.trucks;
    }
    // Load pending orders + order history combined
    try {
      var ordResult = await gs("getPendingServer", null);
      var histResult = await gs("getOrderHistoryServer", null);
      var pending = (ordResult && ordResult.orders) ? ordResult.orders : [];
      var history = (histResult && histResult.orders) ? histResult.orders : [];
      // Merge — pending first, then history
      S.orders = pending.concat(history.filter(function(h){
        return !pending.some(function(p){ return p.id===h.id; });
      }));
      lsSet("hub:orders", S.orders);
    } catch(e){ console.warn("Orders sync:", e.message); }

    badge("done");
  } catch(e){ console.warn("Sync:",e.message); badge("err"); }
  render();
}

function badge(s){
  const b=document.getElementById("sync-badge");
  if(!b)return;
  b.style.display="inline";
  if(s==="syncing"){b.style.cssText="font-size:10px;padding:2px 7px;border-radius:10px;display:inline;background:#0d1f3c;color:#3b82f6;border:1px solid #1e3a5f;";b.textContent="Syncing";}
  else if(s==="done"){b.style.cssText="font-size:10px;padding:2px 7px;border-radius:10px;display:inline;background:#052e16;color:#22c55e;border:1px solid #166534;";b.textContent="Synced";setTimeout(()=>b.style.display="none",3000);}
  else{b.style.cssText="font-size:10px;padding:2px 7px;border-radius:10px;display:inline;background:#1c0a00;color:#f97316;border:1px solid #7c2d12;";b.textContent="Offline";}
}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function uid(){return Math.random().toString(36).slice(2,9);}
function fd(iso){return new Date(iso).toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});}
function sc(p){return p>=90?"#22c55e":p>=75?"#84cc16":p>=60?"#f59e0b":p>=40?"#f97316":"#ef4444";}
function sl(p){return p>=90?"Excellent":p>=75?"Good":p>=60?"Fair":p>=40?"Poor":"Failing";}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function ring(pct,sz){sz=sz||80;const r=(sz-10)/2,c=2*Math.PI*r,o=c-(pct/100)*c,col=sc(pct);
  return '<svg width="'+sz+'" height="'+sz+'" style="display:block;margin:0 auto"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="#1e293b" stroke-width="8"/><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="8" stroke-dasharray="'+c+'" stroke-dashoffset="'+o+'" stroke-linecap="round" transform="rotate(-90 '+sz/2+' '+sz/2+')"/><text x="'+sz/2+'" y="'+(sz/2+5)+'" text-anchor="middle" fill="'+col+'" font-size="'+(sz/4)+'" font-weight="700" font-family="monospace">'+pct+'%</text></svg>';}

// ─── PIN ──────────────────────────────────────────────────────────────────────
let pin="";
// Store email and role entered at login
var loginEmail = "";
var loginRole = ""; // "manager" or "tech" - set at role selection step

function showPinStep(){
  document.getElementById("login-step-email").style.display="none";
  document.getElementById("login-step-role").style.display="none";
  document.getElementById("login-step-pin").style.display="block";
  var disp = document.getElementById("login-email-display");
  if(disp) disp.textContent = loginEmail;
  var roleDisp = document.getElementById("login-role-display");
  if(roleDisp) roleDisp.textContent = loginRole==="manager" ? "Administrator" : "Technician";
  pin=""; dots();
}

function showRoleStep(){
  document.getElementById("login-step-email").style.display="none";
  document.getElementById("login-step-pin").style.display="none";
  document.getElementById("login-step-role").style.display="block";
  var disp = document.getElementById("login-role-email");
  if(disp) disp.textContent = loginEmail;
}

function showEmailStep(){
  document.getElementById("login-step-pin").style.display="none";
  document.getElementById("login-step-role").style.display="none";
  document.getElementById("login-step-email").style.display="block";
  loginEmail=""; loginRole="";
  pin=""; dots();
  var err=document.getElementById("email-err");
  if(err) err.textContent="";
}

function selectRole(role){
  loginRole = role;
  // Set currentUser based on chosen role
  var email = loginEmail;
  if(role==="manager"){
    S.currentUser = S.managers.find(function(m){ return m.email.toLowerCase()===email; });
  } else {
    // For tech role, check tech accounts first, then manager accounts
    S.currentUser = S.techAccounts.find(function(t){ return t.email.toLowerCase()===email; });
    if(!S.currentUser) S.currentUser = S.managers.find(function(m){ return m.email.toLowerCase()===email; });
  }
  showPinStep();
}

async function checkEmail(){
  var inp = document.getElementById("login-email");
  var email = (inp?inp.value:"").trim().toLowerCase();
  var err = document.getElementById("email-err");
  if(!email){ if(err) err.textContent="Please enter your email."; return; }

  // Show loading state
  var btn = document.querySelector("[data-a='email-continue']") || document.querySelector("button[onclick*='checkEmail']");
  if(btn){ btn.disabled=true; btn.textContent="Checking..."; }

  // Make sure Firebase accounts are loaded
  if(!S.managers||S.managers.length===0){
    try {
      await loadAccountsFromSheet();
    } catch(e){ console.warn("Account load:", e); }
  }
  // Check for updates in background
  checkForUpdates(true);

  if(btn){ btn.disabled=false; btn.textContent="Continue"; }

  var isMgr = S.managers.find(function(m){ return m.email.toLowerCase()===email; });
  var isTech = S.techAccounts.find(function(t){ return t.email.toLowerCase()===email; });
  
  if(!isMgr && !isTech){
    if(err) err.textContent="Email not found. Please check and try again.";
    return;
  }
  
  loginEmail = email;
  
  // If email matches BOTH manager and tech accounts - show role selection
  if(isMgr && isTech){
    showRoleStep();
    return;
  }
  
  // If only manager - go straight to PIN as admin
  if(isMgr){
    loginRole="manager";
    S.currentUser=isMgr;
    showPinStep();
    return;
  }
  
  // If only tech - go straight to PIN as tech
  loginRole="tech";
  S.currentUser=isTech;
  showPinStep();
}

function pinTap(k){
  const err=document.getElementById("pin-err");
  if(k==="del"){pin=pin.slice(0,-1);dots();if(err)err.textContent="";return;}
  if(pin.length>=6)return;
  pin+=k; dots();
  if(pin.length>=4){
    if(!S.currentUser){ if(err) err.textContent="Please enter your email first."; pin=""; dots(); return; }
    var user = S.currentUser;
    var correctPin = user.isTemp ? user.tempPin : user.pin;
    if(pin === correctPin){
      var role = loginRole || (S.managers.find(function(m){ return m.id===user.id; }) ? "manager" : "tech");
      if(user.isTemp){ setTimeout(function(){ doLogin(role,true); },200); }
      else { setTimeout(function(){ login(role); },200); }
    } else if(pin.length>=4){
      if(err) err.textContent="Incorrect PIN";
      pin=""; dots();
    }
  }
}

function dots(){for(let i=0;i<4;i++){const d=document.getElementById("d"+i);if(d)d.className="pd"+(pin.length>i?" on":"");}}
var _refreshInterval = null;

function login(role){
  S.role=role;
  S.tab="dashboard";
  if(S.currentUser) S.managerName=S.currentUser.name;
  if(role==="tech" && S.currentUser){ S.checkTech=S.currentUser.name; S.currentTech=S.currentUser.name; }
  if(role==="manager" && S.currentUser) S.currentTech=S.currentUser.name;
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  syncFromSheet();
  saveAccountsToSheet();
  // Show welcome splash after login
  setTimeout(function(){ showWelcomeSplash(); }, 600);
  // Start background order refresh every 2 minutes (managers only)
  if(role==="manager"){
    if(_refreshInterval) clearInterval(_refreshInterval);
    _refreshInterval = setInterval(async function(){
      try {
        const result = await gs("getPendingServer", null);
        if(result && result.orders){
          S.orders = result.orders;
          lsSet("hub:orders", S.orders);
          // Update nav badge and dashboard without full re-render
          var pending = S.orders.filter(function(o){ return o.status==="Pending"; }).length;
          // Re-render nav to update badge
          var mgrTabs=[{id:"dashboard",l:"Home"},{id:"inspect",l:"Fleet"},{id:"inventory",l:"Inventory"},{id:"orders",l:"Orders"},{id:"checkout",l:"Checkout"},{id:"truckinv",l:"Truck Inv"},{id:"restock",l:"Restock"},{id:"analytics",l:"Analytics"},{id:"reports",l:"Reports"},{id:"sign",l:"Sign"},{id:"settings",l:"Settings"}];
          document.getElementById("nav").innerHTML=mgrTabs.map(function(t){
            return "<button class='nb"+(S.tab===t.id?" on":"")+"' data-a='tab' data-v='"+t.id+"'>"+t.l+(t.id==="orders"&&pending>0?"<span class='bdg'>"+pending+"</span>":"")+"</button>";
          }).join("")+"<button class='nb' id='logout-btn' style='color:#475569;'>Exit</button>";
          // Re-attach logout
          var lo=document.getElementById("logout-btn");
          if(lo){ lo.onclick=function(){logout();}; }
          // If on dashboard, refresh it to show alert
          if(S.tab==="dashboard") renderDash();
          // If on orders, refresh it too
          if(S.tab==="orders") renderOrders();
        }
      } catch(e){ console.warn("Background refresh:", e.message); }
    }, 2 * 60 * 1000); // every 2 minutes
  }
}
function logout(){
  S.role=null; S.currentUser=null; S.checkTech=""; pin=""; loginEmail=""; loginRole="";
  if(_refreshInterval){ clearInterval(_refreshInterval); _refreshInterval=null; }
  document.getElementById("app").style.display="none";

}

document.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="check-tech") S.checkTech=t.value;
  if(t.dataset.field&&t.dataset.idx!==undefined){
    const idx=parseInt(t.dataset.idx);
    if(S.checkItems[idx]!==undefined){
      S.checkItems[idx][t.dataset.field]=t.value;
    }
  }
  if(t.id==="insp-truck") S.inspData.truck=t.value;
  if(t.id==="insp-filter"){S.inspListFilter=t.value;render();}
  // Truck assignment dropdown
  if(t.getAttribute && t.getAttribute("data-a")==="assign-truck"){
    var idx = parseInt(t.getAttribute("data-v"));
    assignTruck(idx, t.value);
  }
  // Show/hide "Other" reason text input
  if(t.id && t.id.startsWith("adj-reason-") && !t.id.includes("other")){
    const pid = t.id.replace("adj-reason-","");
    const otherInp = document.getElementById("adj-reason-other-"+pid);
    if(otherInp) otherInp.style.display = t.value==="Other" ? "block" : "none";
  }
  if(t.dataset.prodid&&t.dataset.prodfield){
    const p=S.products.find(x=>x.id===t.dataset.prodid);
    if(p){
      p[t.dataset.prodfield]=t.dataset.prodfield==="unit"?t.value:(parseInt(t.value)||0);
      save();
      // Write qty and lowAt changes back to sheet
      if(t.dataset.prodfield==="qty"||t.dataset.prodfield==="lowAt"||t.dataset.prodfield==="truckWarnAbove"){
        clearTimeout(window._prodSaveTimer);
        window._prodSaveTimer = setTimeout(async function(){
          if(p.row){
            try {
              if(t.dataset.prodfield==="qty") await gs("updateQtyServer",{row:p.row,qty:p.qty});
              if(t.dataset.prodfield==="lowAt") await gs("updateLowAtServer",{row:p.row,lowAt:p.lowAt});
              if(t.dataset.prodfield==="truckWarnAbove") await gs("updateTruckWarnAboveServer",{row:p.row,truckWarnAbove:p.truckWarnAbove||0});
            } catch(e){ console.warn("Product save:",e); }
          }
        }, 1000);
      }
    }
  }
  if(t.id==="mgr-name-inp") S.managerName=t.value;
  if(t.id==="pin-mgr-inp") S._pinMgr=t.value;
  if(t.id==="pin-tech-inp") S._pinTech=t.value;
  // Inspection detail field settings
  if(t.dataset.fieldidx!==undefined&&t.dataset.fieldprop){
    var fi3=parseInt(t.dataset.fieldidx);
    var prop=t.dataset.fieldprop;
    if(S.inspFields[fi3]!==undefined){
      if(prop==="enabled"||prop==="required") S.inspFields[fi3][prop]=t.checked;
      else S.inspFields[fi3][prop]=t.value;
      save();
      clearTimeout(window._fieldSaveTimer);
      window._fieldSaveTimer=setTimeout(function(){saveAccountsToSheet();},1000);
    }
    return;
  }
  // Photo settings in inspection item editor
  if(t.dataset.catid&&t.dataset.itemid&&t.dataset.photofield){
    var cat2=S.cats.find(function(c){return c.id===t.dataset.catid;});
    var item2=cat2?cat2.items.find(function(i){return i.id===t.dataset.itemid;}):null;
    if(item2){
      if(t.dataset.photofield==="requiresPhoto") item2.requiresPhoto=t.checked;
      if(t.dataset.photofield==="maxPhotos") item2.maxPhotos=parseInt(t.value)||1;
      if(t.dataset.photofield==="inputType"){ item2.inputType=t.value; save(); clearTimeout(window._catSaveTimer); window._catSaveTimer=setTimeout(function(){saveAccountsToSheet();},1000); render(); return; }
      if(t.dataset.photofield==="selectOptions") item2.selectOptions=t.value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      save();
      clearTimeout(window._catSaveTimer);
      window._catSaveTimer = setTimeout(function(){ saveAccountsToSheet(); }, 1000);
    }
    return;
  }
  if(t.dataset.catid&&t.dataset.catfield){
    const c=S.cats.find(x=>x.id===t.dataset.catid);
    if(c){c[t.dataset.catfield]=t.dataset.catfield==="scale"?parseInt(t.value):t.value;}
    save(); render();
  }
  if(t.dataset.catid&&t.dataset.itemid){
    const c=S.cats.find(x=>x.id===t.dataset.catid);
    if(c){const i=c.items.find(x=>x.id===t.dataset.itemid);if(i)i.label=t.value;save();}
  }
});

function handleAction(a,v,el,e){

  if(a==="tab") {
    if(S.tab && S.tab!==v){ S._prevTab=S.tab; }
    S.tab=v; S.inspView="home"; S.invView="list"; S.checkDone=false;
    if(v==="checkout") S._checkView="browse";
    render(); return;
  }
  if(a==="nav-back"){
    S.tab = S._prevTab||"dashboard";
    S._prevTab = null;
    render();
    return;
  }
  if(a==="insp-view") { S.inspView=v; render(); return; }
  if(a==="insp-start") { S.inspView="form"; S.inspStep=0; S.inspData={truck:S.trucks[0]||"",mileage:"",inspector:"",notes:"",scores:{},comments:{},photos:[],itemPhotos:{}}; render(); return; }
  if(a==="insp-next") { S.inspStep++; render(); return; }
  if(a==="insp-back") { if(S.inspStep===0){S.inspView="home";}else{S.inspStep--;} render(); return; }

  if(a==="insp-del") { if(confirm("Delete this inspection?")){S.inspections=S.inspections.filter(r=>r.id!==v);save();} S.inspView="list"; render(); return; }
  if(a==="score") { const [ci,ii,n]=v.split("|"); const k=ci+":"+ii; const cur=S.inspData.scores[k]; if(cur===parseInt(n))delete S.inspData.scores[k]; else S.inspData.scores[k]=parseInt(n); render(); return; }
  if(a==="add-photo") { document.getElementById("photo-file").click(); return; }
  if(a==="del-photo") { S.inspData.photos.splice(parseInt(v),1); render(); return; }
  if(a==="del-item-photo") {
    var pp=v.split("|"); var pkey=pp[0]+"|"+pp[1]; var pidx=parseInt(pp[2]);
    var ikey=pp[0]+":"+pp[1];
    if(S.inspData.itemPhotos&&S.inspData.itemPhotos[ikey]) S.inspData.itemPhotos[ikey].splice(pidx,1);
    render(); return;
  }
  if(a==="inv-view") { S.invView=v; render(); return; }
  if(a==="open-adj") { S._adjId=v; S._restockId=null; render(); return; }
  if(a==="toggle-drawer"){ toggleDrawer(); return; }
  if(a==="close-drawer"){ closeDrawer(); return; }
  if(a==="drawer-tab"){
    closeDrawer();
    if(v==="__scan__"){ startScanner("lookup", null, null); return; }
    S.tab=v; S.inspView="home"; S.invView="list"; S.checkDone=false; render(); return;
  }
  if(a==="inv-scan-upc"){ startScanner("register", v, null); return; }
  if(a==="open-profile-photo"){
    var inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.style.display = "none";
    document.body.appendChild(inp);
    inp.onchange = async function(e){
      var file = e.target.files[0]; if(!file){ inp.remove(); return; }
      var reader = new FileReader();
      reader.onload = async function(ev){
        var dataUrl = ev.target.result;
        // Save to current account
        var acctArr = S.role==="manager" ? S.managers : S.techAccounts;
        var acct2 = acctArr.find(function(a2){ return a2.name===(S.managerName||S.currentTech); });
        if(acct2){ acct2.photo = dataUrl; }
        S._userPhoto = dataUrl;
        // Save accounts to Firebase
        await gs("saveAccountsServer", {managers:S.managers, techAccounts:S.techAccounts, trucks:S.trucks, cats:S.cats, inspFields:S.inspFields});
        lsSet("hub:managers", S.managers);
        lsSet("hub:techAccounts", S.techAccounts);
        renderDash();
        inp.remove();
      };
      reader.readAsDataURL(file);
    };

    return;

  if(a==="inv-sds"){

function setPage(id){
  document.querySelectorAll(".pg").forEach(p=>p.classList.remove("on"));
  const pg=document.getElementById("pg-"+id);
  if(pg) pg.classList.add("on");
}

function render(){
  // Nav
  const mgrTabs=[{id:"dashboard",l:"Home"},{id:"inspect",l:"Fleet"},{id:"inventory",l:"Inventory"},{id:"orders",l:"Orders"},{id:"checkout",l:"Checkout"},{id:"truckinv",l:"Truck Inv"},{id:"restock",l:"Restock"},{id:"analytics",l:"Analytics"},{id:"sign",l:"Sign"},{id:"settings",l:"Settings"}];

  const tabs=S.role==="manager"?mgrTabs:techTabs;
  const pending=S.orders.filter(o=>o.status==="Pending").length;
  const pendingSign=S.role==="manager"?0:S.signRequests.filter(function(r){return r.status==="Pending"&&r.techName===S.currentTech;}).length;
  // Update version badge in header
  var vb = document.getElementById("version-badge");
  if(vb) vb.textContent = "v"+APP_VERSION;
  // Show quick action buttons in header area via hamburger
  var hb = document.getElementById("hamburger-btn");
  if(hb){
    var totalBadge = pending + pendingSign;
    hb.innerHTML = totalBadge > 0
      ? "☰ <span style='background:#ef4444;color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;'>"+totalBadge+"</span>"
      : "☰";
  }
  // Show version in header
  var vbadge = document.getElementById("version-badge");
  if(vbadge) vbadge.textContent = "v"+APP_VERSION;
  setPage(S.tab);
  if(S.tab==="dashboard") renderDash();
  else if(S.tab==="inspect") renderInspect();
  else if(S.tab==="inventory") renderInv();
  else if(S.tab==="orders") refreshOrders();
  else if(S.tab==="checkout") renderCheckout();
  else if(S.tab==="truckinv") renderTruckInv();
  else if(S.tab==="restock") renderRestock();
  else if(S.tab==="analytics") renderAnalytics();
  else if(S.tab==="reports") renderReports();
  else if(S.tab==="sign") renderSign();
  else if(S.tab==="settings") renderSettings();
}

function renderInspect(){
  const pg=document.getElementById("pg-inspect");
  if(S.inspView==="home") pg.innerHTML=inspHome();
  else if(S.inspView==="list") pg.innerHTML=inspList();
  else if(S.inspView==="form") pg.innerHTML=inspForm();
  else if(S.inspView==="detail") pg.innerHTML=inspDetail();
}

function inspHome(){
  const mo=S.inspections.filter(i=>new Date(i.date).getMonth()===new Date().getMonth()).length;
  return `<h2 style="font-size:20px;font-weight:700;margin-bottom:16px;">Fleet Inspections</h2>
    <div style="background:linear-gradient(135deg,#0d1f3c,#162235);border-radius:14px;padding:24px;margin-bottom:20px;border:1px solid #1e3a5f;text-align:center;">
      <div style="font-size:36px;margin-bottom:12px;">&#x1F69A;</div>
      <h3 style="font-size:17px;font-weight:700;margin-bottom:6px;">Monthly Vehicle Inspection</h3>
      <p style="color:#475569;font-size:13px;margin-bottom:20px;">Score each truck across 7 categories</p>
      <button class="btn bp" style="font-size:15px;padding:13px 28px;" data-a="insp-start">Start New Inspection</button>
    </div>
    <div class="g3" style="margin-bottom:16px;">
      <div class="sc" style="text-align:center;"><div style="font-size:22px;font-weight:700;color:#3b82f6;">${S.inspections.length}</div><div style="font-size:11px;color:#475569;margin-top:3px;">Total</div></div>
      <div class="sc" style="text-align:center;"><div style="font-size:22px;font-weight:700;color:#3b82f6;">${mo}</div><div style="font-size:11px;color:#475569;margin-top:3px;">This Month</div></div>
      <div class="sc" style="text-align:center;"><div style="font-size:22px;font-weight:700;color:#3b82f6;">${S.trucks.length}</div><div style="font-size:11px;color:#475569;margin-top:3px;">Trucks</div></div>
    </div>
    ${S.inspections.length>0?`<button class="btn bg" style="width:100%;" data-a="insp-view" data-v="list">View All Records</button>`:""}`;

function inspList(){
  const filter=S.inspListFilter||"all";
  const trucks=[...new Set(S.inspections.map(i=>i.truck))];
  const filtered=filter==="all"?S.inspections:S.inspections.filter(i=>i.truck===filter);
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;">
    <button class="btn bg" data-a="insp-view" data-v="home">Back</button>
    <h2 style="font-size:18px;font-weight:700;">Inspection Records</h2>
  </div>
  <select class="inp" style="margin-bottom:14px;" id="insp-filter">
    <option value="all">All Trucks</option>${trucks.map(t=>`<option value="${esc(t)}"${filter===t?" selected":""}>${esc(t)}</option>`).join("")}
  </select>
  ${filtered.length===0?`<div style="text-align:center;color:#475569;padding:40px;">No records found.</div>`:
    filtered.map(r=>`<div class="card" style="display:flex;align-items:center;gap:12px;margin-bottom:8px;cursor:pointer;" data-a="insp-detail" data-v="${r.id}">${ring(r.pct,52)}<div style="flex:1"><div style="font-weight:600;font-size:15px;">${esc(r.truck)}</div><div style="color:#475569;font-size:12px;">${fd(r.date)}${r.inspector?" - "+esc(r.inspector):""}</div></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;"><span class="sbdg" style="background:${sc(r.pct)}22;color:${sc(r.pct)}">${sl(r.pct)}</span><button class="btn bd" style="font-size:11px;padding:3px 8px;" data-a="insp-del" data-v="${r.id}">Delete</button></div></div>`).join("")}`;
}

function inspForm(){
  const {cats,inspData}=S;
  const steps=["Info",...cats.map(c=>c.label),"Photos & Submit"];
  const step=S.inspStep;
  const isInfo=step===0,isPhotos=step===steps.length-1;
  const cat=!isInfo&&!isPhotos?cats[step-1]:null;
  let pct=calcPct();
  const prog=`<div class="pb"><div class="pf" style="width:${(step/(steps.length-1))*100}%"></div></div><div style="display:flex;justify-content:space-between;margin-bottom:16px;"><span style="font-size:12px;color:#475569;">Step ${step+1} of ${steps.length}</span><span style="font-size:12px;color:#475569;">${esc(steps[step])}</span></div>`;
  let body="";
  if(isInfo){
    var fieldHtml = S.inspFields.filter(function(f){return f.enabled!==false;}).map(function(f){
      var val = inspData[f.id]||"";
      var req = f.required ? "<span style='color:#ef4444;margin-left:3px;'>*</span>" : "";
      var input = "";
      if(f.id==="truck"){
        input = "<select class='inp' id='insp-field-"+f.id+"'>"+S.trucks.map(function(t){return "<option value='"+esc(t)+"'"+(inspData.truck===t?" selected":"")+">"+esc(t)+"</option>";}).join("")+"</select>";
      } else if(f.type==="textarea"){
        input = "<textarea class='inp' rows='3' id='insp-field-"+f.id+"' placeholder='"+esc(f.placeholder||"")+"'>"+esc(val)+"</textarea>";
      } else {
        input = "<input type='"+f.type+"' class='inp' id='insp-field-"+f.id+"' value='"+esc(val)+"' placeholder='"+esc(f.placeholder||"")+"'>";
      }
      return "<div style='margin-bottom:14px;'><label style='display:block;font-size:12px;font-weight:600;color:#64748b;text-transform:uppercase;margin-bottom:5px;'>"+esc(f.label)+req+"</label>"+input+"</div>";
    }).join("");
    body=`<h2 style="font-size:17px;font-weight:700;margin-bottom:18px;">Inspection Details</h2>${fieldHtml}`;
  } else if(cat){
    const items=cat.items.map(item=>{
      const key=cat.id+":"+item.id;
      const val=inspData.scores[key];
      const inputType=item.inputType||"score";
      var btns="";
      if(inputType==="score"){
        btns=Array.from({length:cat.scale},(_,i)=>i+1).map(n=>`<button class="skb${val===n?" on":""}" style="${val===n?"background:"+sc((n/cat.scale)*100)+";border-color:"+sc((n/cat.scale)*100)+";":""}" data-a="score" data-v="${cat.id}|${item.id}|${n}">${n}</button>`).join("");
      } else if(inputType==="text"){
        btns=`<input type="text" class="inp" style="font-size:13px;padding:7px 10px;" placeholder="Enter text..." value="${esc(inspData.comments[key]||"")}" data-commentkey="${key}">`;
      } else if(inputType==="textarea"){
        btns=`<textarea class="inp" rows="2" style="font-size:13px;padding:7px 10px;" placeholder="Enter notes..." data-commentkey="${key}">${esc(inspData.comments[key]||"")}</textarea>`;
      } else if(inputType==="number"){
        btns=`<input type="number" class="inp" style="font-size:15px;padding:7px 10px;width:120px;" placeholder="0" value="${inspData.scores[key]!==undefined?inspData.scores[key]:""}" data-key="${key}" data-type="score">`;
      } else if(inputType==="select"){
        const selOpts=(item.selectOptions||[]).map(o=>`<option value="${esc(o)}"${inspData.comments[key]===o?" selected":""}>${esc(o)}</option>`).join("");
        btns=`<select class="inp" style="font-size:13px;" data-commentkey="${key}"><option value="">-- Select --</option>${selOpts}</select>`;
      }
      const noteType2=item.noteType||"text";
      const comment=item.hc?(noteType2==="textarea"?`<textarea class="inp" rows="2" style="margin-top:8px;font-size:13px;padding:7px 10px;" placeholder="Notes (optional)" data-commentkey="${key}">${esc(inspData.comments[key]||"")}</textarea>`:`<input type="${noteType2}" class="inp" style="margin-top:8px;font-size:13px;padding:7px 10px;" placeholder="Notes (optional)" value="${esc(inspData.comments[key]||"")}" data-commentkey="${key}">`):"";
      // Per-item photo
      var itemPhotos2=(inspData.itemPhotos&&inspData.itemPhotos[key])||[];
      var maxP2=item.maxPhotos||1;
      var reqP2=item.requiresPhoto||false;
      var showPhoto2=reqP2||(item.maxPhotos&&item.maxPhotos>0);
      var photoHTML2="";
      if(showPhoto2){
        var thumbHTML="";
        for(var pi2=0;pi2<itemPhotos2.length;pi2++){
          thumbHTML+="<div style='position:relative;display:inline-block;margin:3px;'><img src='"+itemPhotos2[pi2]+"' style='width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid #1e3a5f;'><button style='position:absolute;top:-4px;right:-4px;background:#ef4444;border:none;border-radius:50%;width:18px;height:18px;color:white;font-size:10px;cursor:pointer;line-height:18px;text-align:center;' data-a='del-item-photo' data-v='"+key+"|"+pi2+"'>x</button></div>";
        }
        var addBtn2="";
        if(itemPhotos2.length<maxP2){
          addBtn2="<label style='display:inline-flex;align-items:center;gap:5px;background:#0f1f38;border:1px solid "+(reqP2&&itemPhotos2.length===0?"#f59e0b":"#1e3a5f")+";border-radius:7px;padding:5px 10px;cursor:pointer;font-size:12px;color:"+(reqP2&&itemPhotos2.length===0?"#f59e0b":"#94a3b8")+";margin-top:6px;'>"+(reqP2&&itemPhotos2.length===0?"&#x1F4F7; Recommended":"&#x1F4F7; Add Photo")+" ("+itemPhotos2.length+"/"+maxP2+")<input type='file' accept='image/*' capture='environment' style='display:none;' data-itemkey='"+key+"' onchange='captureItemPhoto(this)'></label>";
        } else {
          addBtn2="<div style='font-size:12px;color:#22c55e;margin-top:6px;'>&#x2713; "+itemPhotos2.length+"/"+maxP2+" photos</div>";
        }
        photoHTML2="<div style='margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;'>"+thumbHTML+addBtn2+"</div>";
      }
      return `<div style="background:#0a1628;border-radius:9px;padding:14px;border:1px solid #1e3a5f;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="font-weight:500;font-size:14px;">${esc(item.label)}${reqP2?" &#x1F4F7;":""}</span><span style="font-family:monospace;font-size:15px;font-weight:700;color:${val===undefined?"#334155":sc((val/cat.scale)*100)}">${val===undefined?"--":val+"/"+cat.scale}</span></div><div style="display:flex;gap:5px;flex-wrap:wrap;">${btns}</div>${comment}${photoHTML2}</div>`;
    }).join("");
    body=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;"><h2 style="font-size:17px;font-weight:700;">${esc(cat.label)}</h2><span style="background:#0d1f3c;color:#93c5fd;padding:3px 10px;border-radius:6px;font-size:12px;">Out of ${cat.scale}</span></div><div style="display:flex;flex-direction:column;gap:14px;">${items}</div>`;
  } else {
    const photos=(inspData.photos||[]).map((ph,i)=>`<div style="position:relative;"><img src="${ph.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;"><button style="position:absolute;top:3px;right:3px;background:#ef4444;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;" data-a="del-photo" data-v="${i}">x</button></div>`).join("");
    body=`<h2 style="font-size:17px;font-weight:700;margin-bottom:6px;">Photos & Submit</h2>
      <p style="color:#475569;font-size:13px;margin-bottom:16px;">Review your score and save.</p>
      <div style="background:#0a1628;border-radius:10px;padding:16px;margin-bottom:16px;text-align:center;border:2px solid ${sc(pct)}30;">${ring(pct,90)}<div style="margin-top:6px;font-size:18px;font-weight:700;color:${sc(pct)}">${sl(pct)}</div><div style="color:#475569;font-size:12px;margin-top:2px;">${esc(inspData.truck)}</div></div>
      <input type="file" id="photo-file" accept="image/*" multiple style="display:none">
      <button class="btn bg" style="width:100%;padding:12px;margin-bottom:12px;" data-a="add-photo">Add Photos</button>
      <div class="g3">${photos}</div>`;
  }
  const back=`<button class="btn bg" style="flex:1;" data-a="insp-back">Back</button>`;
  const fwd=isPhotos?`<button class="btn bs" style="flex:2;" data-a="insp-save">Save Inspection</button>`:`<button class="btn bp" style="flex:2;" data-a="insp-next">Next</button>`;
  return `${prog}<div class="card" style="margin-bottom:14px;">${body}</div><div style="display:flex;gap:10px;">${back}${fwd}</div>`;
}

function inspDetail(){
  const r=S.detailInsp;
  if(!r) return "";
  const cats=S.cats.map(cat=>{
    const scored=cat.items.filter(i=>r.scores[cat.id+":"+i.id]!==undefined);
    if(!scored.length) return "";
    const e=scored.reduce((a,i)=>a+(r.scores[cat.id+":"+i.id]||0),0);
    const cp=Math.round((e/(cat.items.length*cat.scale))*100);
    return `<div class="card" style="margin-bottom:10px;padding:0;overflow:hidden;"><div style="padding:10px 14px;background:#0a1628;display:flex;justify-content:space-between;"><span style="font-weight:600;font-size:14px;">${esc(cat.label)}</span><span style="font-family:monospace;font-size:13px;font-weight:700;color:${sc(cp)}">${cp}%</span></div><div style="padding:14px;">${cat.items.map(item=>{const s=r.scores[cat.id+":"+item.id];const cm=r.comments?.[cat.id+":"+item.id];return `<div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;"><div><div style="font-size:13px;">${esc(item.label)}</div>${cm?`<div style="font-size:11px;color:#64748b;">"${esc(cm)}"</div>`:""}</div><span style="font-family:monospace;font-size:13px;font-weight:700;white-space:nowrap;color:${s===undefined?"#334155":sc((s/cat.scale)*100)}">${s===undefined?"--":s+"/"+cat.scale}</span></div>`;}).join("")}</div></div>`;
  }).join("");
  const photos=r.photos?.length?`<div class="card" style="margin-top:8px;"><div style="font-size:11px;color:#475569;text-transform:uppercase;margin-bottom:10px;">Photos (${r.photos.length})</div><div class="g3">${r.photos.map(ph=>`<img src="${ph.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:7px;">`).join("")}</div></div>`:"";
  return `<div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;"><button class="btn bg" data-a="insp-view" data-v="list">Back</button><button class="btn bd" data-a="insp-del" data-v="${r.id}">Delete</button></div>
    <div style="display:flex;gap:14px;align-items:center;margin-bottom:20px;">${ring(r.pct,72)}<div><h2 style="font-size:20px;font-weight:700;">${esc(r.truck)}</h2><div style="color:#475569;font-size:13px;margin-top:3px;">${fd(r.date)}${r.inspector?" - "+esc(r.inspector):""}</div>${r.mileage?`<div style="color:#64748b;font-size:12px;margin-top:2px;">${Number(r.mileage).toLocaleString()} miles</div>`:""}</div></div>
    ${r.notes?`<div class="card" style="margin-bottom:12px;"><div style="font-size:11px;color:#475569;text-transform:uppercase;margin-bottom:5px;">Notes</div><p style="font-size:13px;color:#cbd5e1;">${esc(r.notes)}</p></div>`:""}
    ${cats}${photos}`;
}

function calcPct(){
  let e=0,p=0;
  S.cats.forEach(c=>c.items.forEach(item=>{p+=c.scale;const s=S.inspData.scores[c.id+":"+item.id];if(s!==undefined)e+=s;}));
  return p>0?Math.round((e/p)*100):0;
}

function captureItemPhoto(input){
  var key = input.getAttribute("data-itemkey");
  var file = input.files[0];
  if(!file||!key) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var img = new Image();
    img.onload = function(){
      var canvas = document.createElement("canvas");
      var maxSize = 1024;
      var w=img.width, h=img.height;
      if(w>h){ if(w>maxSize){h=h*maxSize/w;w=maxSize;} }
      else { if(h>maxSize){w=w*maxSize/h;h=maxSize;} }
      canvas.width=w; canvas.height=h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      var dataUrl = canvas.toDataURL("image/jpeg",0.75);
      if(!S.inspData.itemPhotos) S.inspData.itemPhotos={};
      if(!S.inspData.itemPhotos[key]) S.inspData.itemPhotos[key]=[];
      S.inspData.itemPhotos[key].push(dataUrl);
      render();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveInsp(){
  const pct=calcPct();
  const rec={id:uid(),date:new Date().toISOString(),...S.inspData,pct};
  S.inspections.unshift(rec);
  S.inspView="home"; save(); render();
  const catH=S.cats.flatMap(c=>c.items.map(i=>c.label+": "+i.label+" (/"+c.scale+")"));
  const headers=["Date","Truck","Inspector","Mileage","Overall %",...catH];
  const catS=S.cats.flatMap(c=>c.items.map(item=>{const s=S.inspData.scores[c.id+":"+item.id];return s!==undefined?s:"";}));
  const row=[new Date(rec.date).toLocaleDateString("en-US"),rec.truck,rec.inspector||"",rec.mileage||"",pct,...catS];
  try { await gs("logInspectionServer",{headers,row}); } catch(e){}

  // Generate PDF of inspection and save to Drive
  try {
    var pdfData = buildInspectionPdfData(rec);
    gs("saveInspectionPdfServer", pdfData).then(function(res){
      if(res&&res.ok) console.log("Inspection PDF saved:", res.fileId);
    }).catch(function(e){ console.warn("PDF save failed:", e); });
  } catch(e){ console.warn("PDF build failed:", e); }
}

    +"</style></head><body>"
    +"<div class='header'><div>"
    +"<h1>Fox Pest Control - Fleet Inspection</h1>"
    +"<div style='color:#555;'>Willamette Valley Branch</div>"
    +"</div><div style='text-align:right;'>"

    +"<div style='font-size:11px;color:#666;'>Inspector: "+esc(rec.inspector||"")+"</div>"

    +"</div></div>"

async function doAdj(id){
  const val=parseInt(document.getElementById("adj-"+id)?.value);
  if(isNaN(val)){alert("Enter a valid quantity.");return;}
  const sel=document.getElementById("adj-reason-"+id);
  const otherInp=document.getElementById("adj-reason-other-"+id);
  let reason=(sel?sel.value:"Adjustment");
  if(reason==="Other") reason=(otherInp&&otherInp.value.trim())?otherInp.value.trim():"Other";
  const p=S.products.find(x=>x.id===id); if(!p) return;
  const old=p.qty;
  const newQty=Math.max(0,val);
  p.qty=newQty; S._adjId=null;
  save();
  try {
    await gs("updateQtyServer",{row:p.row,qty:newQty});
    await gs("logAdjustmentServer",{product:p.name,unit:p.unit,oldQty:old,newQty:newQty,manager:S.managerName,reason:reason});
  } catch(e){ console.warn("Adj sheet write:",e); }
  render();
}

async function submitCartOrder(){
  var cartItems = Object.keys(S.cart||{}).filter(function(k){ return S.cart[k]>0; });
  if(cartItems.length===0){ alert("Cart is empty"); return; }

  var techName = S.checkTech||S.currentTech||S.managerName||"";
  if(!techName){ alert("Please select your name first"); S._checkView="browse"; renderCheckout(); return; }

  var selectedItems = cartItems.map(function(pid){
    var prod = S.products.find(function(p){ return p.id===pid; });
    return { id:pid, name:prod?prod.name:"", unit:prod?prod.unit:"", qty:S.cart[pid], qtyOrdered:S.cart[pid] };
  });

  var comments = S._cartComments||"";
  var orderId = "ord_"+Date.now();
  var orderDoc = {
    id:orderId, tech:techName, date:new Date().toISOString(),
    status:"Pending", items:selectedItems, notes:comments,
    requestedBy:techName
  };

  try {
    await gs("savePendingOrder", orderDoc);
    // Write to order sheet
    gs("writeToOrderSheet", {items:selectedItems}).catch(function(){});
    // Email manager
    var itemList = selectedItems.map(function(i){ return "- "+i.name+" x"+i.qty; }).join("\n");
    sendEmail("john.kluttz@fox-marketingservices.com",
      "[Fox Pest] Product Request: "+techName,
      techName+" has submitted a product request:\n\n"+itemList+(comments?"\n\nComments: "+comments:"")+"\n\nFox Pest Control - Willamette Valley"
    );
    // Clear cart
    S.cart={};
    S._cartComments="";
    S._checkView="browse";
    lsSet("hub:cart", S.cart);
    S.checkDone=true;
    renderCheckout();
  } catch(e){
    alert("Error submitting order: "+e.message);
  }
}

async function submitCheckout(){
  // Prevent double submission
  const submitBtn = document.querySelector("[data-a='submit-checkout']");
  if(submitBtn){
    if(submitBtn.disabled) return;
    submitBtn.disabled=true;
    submitBtn.textContent="Submitting...";
    submitBtn.style.opacity="0.6";
  }
  snapshotCheckItems();
  const techSel=document.getElementById("check-tech");
  const tech=techSel?techSel.value:S.checkTech;
  if(!tech){
    alert("Please select your name.");
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=S.role==="manager"?"Process Checkout":"Submit Request";submitBtn.style.opacity="1";}
    return;
  }
  S.checkTech=tech;
  // Support both old checkItems and new checkQtys format
  var valid;
  if(S.checkQtys && Object.keys(S.checkQtys).length){
    valid = Object.keys(S.checkQtys).filter(function(pid){
      return parseInt(S.checkQtys[pid])>0;
    }).map(function(pid){
      var prod = S.products.find(function(p){ return p.id===pid; });
      return {productId:pid, qty:S.checkQtys[pid], notes:"", name:prod?prod.name:""};
    });
  } else {
    valid=S.checkItems.filter(i=>i.productId&&parseInt(i.qty)>0);
  }
  if(!valid.length){
    alert("Please add at least one product with a quantity.");
    if(submitBtn){submitBtn.disabled=false;submitBtn.textContent=S.role==="manager"?"Process Checkout":"Submit Request";submitBtn.style.opacity="1";}
    return;
  }
  const isM=S.role==="manager";

  // For techs: check truck inventory against manager-set thresholds
  if(!isM){
    const truckInv=(S.truckInventories[tech]||{}).products||[];
    const hasEnough=valid.filter(function(item){
      const t=truckInv.find(function(t){return t.id===item.productId;});
      if(!t) return false;
      const prod=S.products.find(function(p){return p.id===item.productId;});
      const threshold=prod?((prod.truckWarnAbove!==undefined)?prod.truckWarnAbove:0):0;
      // Warn if threshold is set (>0) and truck qty is above threshold
      return threshold>0 && t.qty>threshold;
    });
    if(hasEnough.length>0){
      const names=hasEnough.map(function(item){
        const p=S.products.find(function(p){return p.id===item.productId;});
        const t=truckInv.find(function(t){return t.id===item.productId;});
        return (p?p.name:"Product")+": "+t.qty+" "+t.unit+" on your truck";
      }).join("\n");
      alert("Your truck inventory shows you already have enough of the following:\n\n"+names+"\n\nPlease correct your truck inventory first, then request again if still needed.");
      return;
    }
  }
  const te=S.techEmails.find(t=>t.name===tech);
  const techEmail=te?te.email:"";
  const date=new Date().toISOString();

  if(isM){
    // Manager checkout - process each item, update inventory, log to sheet
    const low=[], checkoutWrites=[];
    for(const item of valid){
      const prod=S.products.find(p=>p.id===item.productId); if(!prod) continue;
      const newQty=Math.max(0,prod.qty-parseInt(item.qty));
      prod.qty=newQty;
      const rec={id:uid(),date,tech,techEmail,product:prod.name,qty:parseInt(item.qty),unit:prod.unit,notes:item.notes||""};
      S.checkouts.unshift(rec);
      checkoutWrites.push(gs("updateQtyServer",{row:prod.row,qty:newQty}));
      checkoutWrites.push(gs("logCheckoutServer",rec));
      if(prod.qty<=prod.lowAt) low.push(prod);
    }
    try { await Promise.all(checkoutWrites); } catch(e){ console.warn("Checkout writes:", e); }
    if(low.length) sendLowEmail(low);
  } else {
    // Tech request - bundle ALL items into ONE order with ONE email
    const orderId="ORD-"+Date.now();
    const itemLines=valid.map(function(item){
      const prod=S.products.find(p=>p.id===item.productId);
      return prod?(prod.name+" x "+item.qty+" "+prod.unit+(item.notes?" ("+item.notes+")":"")):item.productId;
    });

    // Save ALL items as ONE grouped order document
    const orderItems = valid.map(function(item){
      const prod=S.products.find(p=>p.id===item.productId); if(!prod) return null;
      return {name:prod.name, productId:prod.id, qty:parseInt(item.qty),
        unit:prod.unit, notes:item.notes||"", approvedQty:0, status:"Pending"};
    }).filter(Boolean);

    const groupedOrder = {
      id: orderId, date, tech, techEmail,
      status: "Pending", items: orderItems,
      approvedBy: "", createdAt: new Date().toISOString()
    };
    S.orders.unshift(groupedOrder);
    const orders = [groupedOrder];
    try { await gs("addPendingOrderServer", groupedOrder); } catch(e){ console.warn("Order save:", e); }

    // Send ONE combined email for all items
    if(orders.length>0){
      const itemList=itemLines.join("\n  - ");
      const miscNotes = (document.getElementById("checkout-misc")||{}).value||"";
      const body="Product Request - Fox Pest Control Willamette Valley\n\n"
        +"Technician: "+tech+"\n"
        +"Date: "+new Date(date).toLocaleDateString("en-US")+"\n\n"
        +"Items Requested:\n  - "+itemList+"\n\n"
        +(miscNotes?"Additional Notes:\n"+miscNotes+"\n\n":"")
        +"Log in to the Admin Hub to approve or deny each item.\n\n"
        +"Automated notification from Fox Admin Hub.";
      try { await gs("sendEmailServer",{to:getMGMT().join(","),
        subject:"[Fox Pest Control] Product Request - "+tech+" ("+orders.length+" item"+(orders.length>1?"s":"")+")",
        body:body}); } catch(e){}
    }
  }
  save(); S.checkDone=true; render();
}
