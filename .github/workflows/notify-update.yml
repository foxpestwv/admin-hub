name: Notify App Update

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install cryptography
        run: pip install cryptography --quiet

      - name: Update Firebase version
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Extract version - get first match only
          VERSION=$(grep -o 'APP_VERSION = "[^"]*"' index.html | head -1 | grep -o '"[^"]*"' | tr -d '"')
          NOTE="${{ github.event.head_commit.message }}"
          NOTE=$(echo "$NOTE" | head -1 | cut -c1-100)
          echo "Version: $VERSION"
          echo "Note: $NOTE"

          echo "$FIREBASE_SA" > /tmp/sa.json

          python3 << PYEOF
import json, time, base64, urllib.request, urllib.parse
from cryptography.hazmat.primitives import hashes, serialization
from cryptography.hazmat.primitives.asymmetric import padding

with open('/tmp/sa.json') as f:
    sa = json.load(f)

version = "$VERSION"
note = """$NOTE"""

now = int(time.time())
hdr = base64.urlsafe_b64encode(json.dumps({"alg":"RS256","typ":"JWT"}).encode()).rstrip(b'=').decode()
clm = base64.urlsafe_b64encode(json.dumps({
    "iss": sa["client_email"],
    "scope": "https://www.googleapis.com/auth/datastore",
    "aud": sa["token_uri"],
    "exp": now+3600, "iat": now
}).encode()).rstrip(b'=').decode()
sig_in = f"{hdr}.{clm}".encode()
key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
sig = base64.urlsafe_b64encode(key.sign(sig_in, padding.PKCS1v15(), hashes.SHA256())).rstrip(b'=').decode()
jwt = f"{hdr}.{clm}.{sig}"

data = urllib.parse.urlencode({
    "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
    "assertion": jwt
}).encode()
token_resp = json.loads(urllib.request.urlopen(
    urllib.request.Request(sa["token_uri"], data=data)).read())
token = token_resp["access_token"]

url = f"https://firestore.googleapis.com/v1/projects/{sa['project_id']}/databases/(default)/documents/config/appVersion"
payload = json.dumps({"fields": {
    "version": {"stringValue": version},
    "note": {"stringValue": note},
    "updatedAt": {"stringValue": __import__('datetime').datetime.utcnow().isoformat()+"Z"}
}}).encode()
req = urllib.request.Request(url, data=payload, method="PATCH",
    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
print(urllib.request.urlopen(req).read().decode())
print(f"Done — version={version}, note={note}")
PYEOF
